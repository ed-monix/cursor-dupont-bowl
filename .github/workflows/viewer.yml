name: Viewer

# Pages is "Deploy from a branch" → main → / (legacy).
# That serves index.html at the site root. GitHub Actions Pages deploy
# 404s while that setting is on, so this job writes index.html into git.

on:
  push:
    branches: [main]
    paths-ignore:
      - "index.html"
      - ".nojekyll"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viewer-index
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Build board
        run: python scripts/build_viewer.py --season 2026 --out index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "board unchanged"
            exit 0
          fi
          git commit -m "board: rebuild index.html"
          git push
