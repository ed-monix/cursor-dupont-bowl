<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The DuPont Bowl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    /* Light theme (Linear-flavored, cool-biased neutrals) */
    --bg:#f7f8f9; --panel:#ffffff; --panel-2:#fbfbfc;
    --border:#e6e8ec; --border-strong:#d6d9df;
    --text:#111318; --muted:#6b7280; --faint:#9aa1ab;
    --accent:#5e6ad2; --accent-soft:#eceefb;
    --win:#3f9d6d; --live:#e5674d;
    --shadow:0 1px 2px rgba(17,19,24,.04),0 4px 16px rgba(17,19,24,.06);
    --glow:transparent;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#08090a; --panel:#0f1011; --panel-2:#141517;
      --border:#1f2124; --border-strong:#2a2d31;
      --text:#f7f8f8; --muted:#878c95; --faint:#565a61;
      --accent:#7c89f5; --accent-soft:#181a2e;
      --win:#4cc38a; --live:#f0785a;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.35);
      --glow:radial-gradient(60% 120% at 50% -10%, rgba(124,137,245,.10), transparent 70%);
    }
  }
  :root[data-theme="dark"]{
    --bg:#08090a; --panel:#0f1011; --panel-2:#141517;
    --border:#1f2124; --border-strong:#2a2d31;
    --text:#f7f8f8; --muted:#878c95; --faint:#565a61;
    --accent:#7c89f5; --accent-soft:#181a2e;
    --win:#4cc38a; --live:#f0785a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.35);
    --glow:radial-gradient(60% 120% at 50% -10%, rgba(124,137,245,.10), transparent 70%);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
    background-image:var(--glow);background-repeat:no-repeat;
    overflow-x:hidden;
  }
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  /* Top bar */
  .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:20px;
    height:56px;padding:0 20px;padding-top:env(safe-area-inset-top);
    background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;
    white-space:nowrap;min-width:0}
  .brand .trophy{color:var(--accent);flex:0 0 auto}
  .spacer{flex:1}
  .weeknav{display:flex;align-items:center;gap:2px}
  .weeknav.off{visibility:hidden}
  .wkbtn{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--border);
    background:var(--panel);border-radius:7px;color:var(--muted);font-size:15px;line-height:1;
    transition:.13s}
  .wkbtn:hover:not(:disabled){color:var(--text);border-color:var(--border-strong)}
  .wkbtn:disabled{opacity:.4;cursor:default}
  .wklabel{min-width:132px;text-align:center;font-weight:500;display:flex;
    align-items:center;justify-content:center;gap:8px}
  .seg{display:flex;padding:2px;background:var(--panel-2);border:1px solid var(--border);
    border-radius:9px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:500;
    padding:5px 12px;border-radius:7px;transition:.13s}
  .seg button:hover{color:var(--text)}
  .seg button[aria-selected="true"]{background:var(--panel);color:var(--text);
    box-shadow:var(--shadow)}

  /* Status pill */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
    letter-spacing:.02em;padding:2px 8px;border-radius:999px;text-transform:uppercase}
  .pill.final{color:var(--faint);background:var(--panel-2);border:1px solid var(--border)}
  .pill.live{color:var(--live);background:color-mix(in srgb,var(--live) 12%,transparent)}
  .pill.office{color:var(--muted);background:var(--panel-2);border:1px solid var(--border);text-transform:none;letter-spacing:0;font-weight:500}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.live .dot{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.pill.live .dot{animation:none}}

  /* Layout */
  main{max-width:760px;margin:0 auto;padding:28px 20px 72px}
  .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
    font-weight:600;margin:0 4px 12px}

  /* Matchup row */
  .match{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    margin-bottom:10px;overflow:hidden;transition:border-color .13s}
  .match:hover{border-color:var(--border-strong)}
  .matchhead{display:grid;grid-template-columns:1fr auto 1fr 20px;align-items:center;
    gap:14px;padding:14px 16px;width:100%;text-align:left;border:0;background:transparent;
    color:inherit}
  .team{min-width:0;display:flex;flex-direction:column;gap:2px}
  .team.away{align-items:flex-end;text-align:right}
  .tname{font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%}
  .trec{font-size:12px;color:var(--faint)}
  .team.lose .tname{color:var(--muted);font-weight:500}
  .scorebox{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600}
  .pts{color:var(--muted)}
  .pts.win{color:var(--text)}
  .pts.win.accent{color:var(--accent)}
  .vs{color:var(--faint);font-size:12px;font-weight:500}
  .chev{color:var(--faint);transition:transform .16s ease;justify-self:center}
  .match[data-open="true"] .chev{transform:rotate(90deg)}
  .margintag{display:block;text-align:center;font-size:11px;color:var(--faint);
    margin-top:-4px;padding-bottom:2px}

  /* Detail */
  .detail{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border)}
  .col{padding:6px 4px}
  .col+.col{border-left:1px solid var(--border)}
  .col.win{background:color-mix(in srgb,var(--accent) 5%,transparent)}
  .prow{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:baseline;
    padding:6px 12px}
  .slot{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .pmid{min-width:0}
  .pname{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pmeta{color:var(--faint);font-size:11px;margin-left:5px}
  .pstat{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .ppts{font-size:13px;font-weight:500}
  .prow.out .pname,.prow.out .ppts{color:var(--faint)}
  .prow.out .pstat{font-style:italic;color:var(--faint)}

  /* Standings */
  table{width:100%;border-collapse:collapse}
  .stand{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    overflow:auto;-webkit-overflow-scrolling:touch}
  th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);
    font-weight:600;text-align:right;padding:11px 14px;border-bottom:1px solid var(--border)}
  th.l{text-align:left}
  td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--border);font-size:13px}
  td.l{text-align:left}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--panel-2)}
  .rank{color:var(--faint);width:26px}
  .rank.pf{color:var(--accent);font-weight:600}
  .stteam{font-weight:600;letter-spacing:-.01em}
  .rec{color:var(--muted)}
  .playoff td{border-bottom:1px solid var(--border)}
  .cut{position:relative}
  .cut td{box-shadow:inset 0 -1px 0 var(--accent)}
  .cutnote{font-size:10px;color:var(--accent);font-weight:600;letter-spacing:.04em;
    padding:10px 6px 0}

  /* Bracket */
  .bracket{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
  .round{display:flex;flex-direction:column;gap:10px}
  .rlabel{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
    font-weight:600;padding:0 2px}
  .bmatch{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .bmatch .bseed+.bseed{border-top:1px solid var(--border)}
  .byebox{display:flex;flex-direction:column;gap:8px}
  .byebox .bseed{border:1px dashed var(--border);border-radius:10px}
  .champbox .bseed{border:1px solid var(--accent);border-radius:10px}
  .bseed{display:flex;align-items:center;gap:8px;padding:9px 11px}
  .bnum{width:15px;color:var(--faint);font-size:11px;font-weight:600;flex:0 0 auto}
  .bname{flex:1;min-width:0;font-size:12.5px;font-weight:500;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .brec{color:var(--faint);font-size:11px}
  .btag{font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);flex:0 0 auto}
  .bseed.proj .bname{color:var(--muted);font-weight:500}
  .bseed.champ{background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .bseed.champ .bname{color:var(--text);font-weight:700}
  .bseed.champ .bnum{color:var(--accent)}
  @media (max-width:640px){.bracket{grid-template-columns:1fr}}

  /* Feed */
  .feedcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;margin-bottom:12px}
  .feedhd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;
    padding-bottom:10px;border-bottom:1px solid var(--border)}
  .feedkicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);
    font-weight:700}
  .feedby{font-size:11px;color:var(--faint)}
  .prose{white-space:pre-wrap;font-size:13px;line-height:1.55;color:var(--text)}
  .feedempty{font-size:12.5px;color:var(--faint);font-style:italic}
  .forumlist{display:flex;flex-direction:column;gap:13px}
  .txlist{display:flex;flex-direction:column;gap:12px}
  .txrow{border-left:2px solid var(--border);padding:1px 0 2px 12px}
  .txrow.trade{border-left-color:var(--accent)}
  .txkind{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
    font-weight:700}
  .txhead{font-size:13px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
  .txsub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .txnote{font-size:12px;color:var(--muted);font-style:italic;margin-top:3px;line-height:1.4}
  .post{border-left:2px solid var(--border);padding:1px 0 1px 12px}
  .postname{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
  .posttext{font-size:13px;color:var(--text);margin-top:2px;white-space:pre-wrap}

  /* Guide */
  .guidecard{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px;margin-bottom:12px}
  .gh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
    font-weight:600;margin:0 0 12px}
  .castlist{display:flex;flex-direction:column}
  .castrow{padding:11px 0;border-bottom:1px solid var(--border)}
  .castrow:last-child{border-bottom:0}
  .casttop{display:flex;align-items:baseline;gap:10px}
  .castname{font-weight:600;letter-spacing:-.01em}
  .castkind{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);
    border:1px solid var(--border);border-radius:999px;padding:1px 7px}
  .castrec{margin-left:auto;color:var(--muted);font-size:12px}
  .castbio{font-size:12.5px;color:var(--muted);margin-top:3px}
  .howlist{display:flex;flex-direction:column;gap:9px}
  .howrow{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  .howcmd{flex:0 0 auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
    color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:6px}
  .howdesc{font-size:13px;color:var(--text)}

  /* GM subtitle under a team name */
  .tgm{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .team.lose .tgm{color:var(--faint)}
  .stteam .stname{display:block}
  .stgm{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:1px}
  .castgm{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}

  /* Draft */
  .draftcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;margin-bottom:12px}
  .draftlist{display:flex;flex-direction:column}
  .drow{display:grid;grid-template-columns:44px 1fr 1fr;gap:12px;align-items:baseline;
    padding:9px 2px;border-bottom:1px solid var(--border)}
  .drow:last-child{border-bottom:0}
  .dpick{color:var(--faint);font-size:12px;font-weight:600}
  .dteam{min-width:0}
  .dtname{font-weight:600;letter-spacing:-.01em;font-size:13px;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dgm{display:block;font-size:11px;color:var(--faint);font-weight:400}
  .dplayer{min-width:0}
  .dpname{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dpmeta{font-size:11px;color:var(--faint)}
  .dcomment{grid-column:2 / 4;font-size:12px;color:var(--muted);font-style:italic;
    margin-top:3px;line-height:1.4}
  @media (max-width:560px){
    .drow{grid-template-columns:38px 1fr}
    .dplayer{grid-column:2}.dcomment{grid-column:1 / 3}
  }

  /* Rosters */
  .teampicker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .teampill{border:1px solid var(--border);background:var(--panel);color:var(--muted);
    font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;transition:.13s}
  .teampill:hover{color:var(--text);border-color:var(--border-strong)}
  .teampill[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);
    border-color:transparent;font-weight:600}
  .rostercard{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;margin-bottom:12px}
  .rosterhd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
  .rname{font-weight:700;letter-spacing:-.01em;font-size:15px}
  .rgm{font-size:12px;color:var(--muted);margin-top:1px}
  .rfaab{font-size:11.5px;color:var(--faint)}
  .rrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:baseline;
    padding:7px 2px;border-bottom:1px solid var(--border)}
  .rrow:last-child{border-bottom:0}
  .rslot{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .rpname{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rpname.empty{color:var(--faint);font-style:italic}
  .rpmeta{color:var(--faint);font-size:11px;text-align:right;white-space:nowrap}

  /* Schedule */
  .schedcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;margin-bottom:10px}
  .schedwk{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
    font-weight:600;margin:0 0 8px}
  .schedrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;
    padding:6px 2px;font-size:13px}
  .schedrow+.schedrow{border-top:1px solid var(--border)}
  .schedaway{text-align:right}
  .schedvs{color:var(--faint);font-size:11px}

  footer{max-width:760px;margin:0 auto;padding:8px 24px calc(40px + env(safe-area-inset-bottom));color:var(--faint);
    font-size:11.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  a{color:var(--muted)}
  @media (max-width:560px){
    .detail{grid-template-columns:1fr}
    .col+.col{border-left:0;border-top:1px solid var(--border)}
  }

  /* Phone: stack chrome, swipe tabs, stack matchups, bigger taps */
  @media (max-width:720px){
    .topbar{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      grid-template-areas:"brand office" "week week" "tabs tabs";
      height:auto;align-items:center;gap:8px 10px;
      padding:10px 12px 8px;padding-top:max(10px, env(safe-area-inset-top));
    }
    .brand{grid-area:brand}
    #office{grid-area:office;justify-self:end;min-width:0}
    #office .pill{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .spacer{display:none}
    .weeknav{grid-area:week;justify-content:center}
    .weeknav.off{display:none;visibility:visible}
    .wklabel{min-width:0;flex:1}
    .wkbtn{width:36px;height:36px}
    .seg{
      grid-area:tabs;width:100%;max-width:100%;
      overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;
    }
    .seg::-webkit-scrollbar{display:none}
    .seg button{flex:0 0 auto;padding:8px 12px;font-size:13px}
    main{padding:18px 14px 56px}
    .matchhead{
      grid-template-columns:minmax(0,1fr) 20px;
      grid-template-areas:"home chev" "score chev" "away chev";
      gap:4px 8px;padding:12px 12px 8px;
    }
    .team.home{grid-area:home}
    .scorebox{grid-area:score;justify-content:flex-start;font-size:22px;gap:8px;padding:2px 0 4px}
    .team.away{grid-area:away;align-items:flex-start;text-align:left}
    .chev{grid-area:chev}
    .tname{white-space:normal}
    .casttop{flex-wrap:wrap}
    .castrec{margin-left:0}
    .stand table{min-width:420px}
    th:nth-child(6),td:nth-child(6){display:none}
    .schedrow{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;font-size:12.5px}
    .schedaway,.schedrow > span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  }
  @media (max-width:380px){
    .brand span.txt{font-size:13px}
  }
</style>

<div class="topbar">
  <div class="brand"><svg class="trophy" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg><span class="txt">The DuPont Bowl</span></div>
  <span id="office"></span>
  <div class="spacer"></div>
  <div class="weeknav">
    <button class="wkbtn" id="prev" aria-label="Previous week">‹</button>
    <div class="wklabel"><span id="wklabel">Week 1</span><span id="wkstatus"></span></div>
    <button class="wkbtn" id="next" aria-label="Next week">›</button>
  </div>
  <div class="spacer"></div>
  <div class="seg" role="tablist">
    <button id="tab-scores" role="tab" aria-selected="true">Scores</button>
    <button id="tab-feed" role="tab" aria-selected="false">Feed</button>
    <button id="tab-standings" role="tab" aria-selected="false">Standings</button>
    <button id="tab-bracket" role="tab" aria-selected="false">Bracket</button>
    <button id="tab-schedule" role="tab" aria-selected="false">Schedule</button>
    <button id="tab-rosters" role="tab" aria-selected="false">Rosters</button>
    <button id="tab-draft" role="tab" aria-selected="false">Draft</button>
    <button id="tab-guide" role="tab" aria-selected="false">Guide</button>
  </div>
</div>

<main>
  <p class="eyebrow" id="eyebrow">Matchups</p>
  <div id="view"></div>
</main>
<footer>
  <span id="foot-left">The DuPont Bowl · 2026</span>

on an NFL roster, and I need you to sit with the best one: Selina Meyer and Gary Walsh's team drafted Le'Veon Bell. The running back. Who has not carried a football professionally in some years. Gary went on the record \u2014 the actual public record, in the actual forum, I have the receipts \u2014 to say, quote, \"technically that one's on me... it's fine, it's on me.\" Gary. Baby. Nobody asked you to confess, but I respect the honesty. It's very Kardashian of you.\n\nBut the real story, the story I will be telling at Thanksgiving for years, is what happened to the quarterback position the SECOND the corrections cleared. Coach-taylor and Costanza woke up with zero \u2014 zero! \u2014 quarterbacks between them, like two men who showed up to a wedding without pants, and by dinner Leon Black had declared himself the entire QB retail sector, Costanza had gone from a goose egg to FIVE signal-callers in a single afternoon, and half this league was trading tight ends like they were rationed goods in a war. Meanwhile, out there in the real NFL, Patrick Mahomes \u2014 who Leon already owned before he went shopping for a third quarterback like the man collects them \u2014 is \"on track\" but everyone's quietly wondering about the mobility. Leon didn't blink. That's not a red flag, sweetie, that's a BRAND. Welcome to the season. Buckle up, and for God's sake, somebody check on Gary.\n\n---\n\n## AROUND THE LEAGUE\n\n**coach-taylor** \u2014 Preached \"eyes clear, hearts full\" from a stance of literally zero quarterbacks, then quietly walked away from the day with THREE (Cousins at a self-described \"genuine-need ceiling\" of $25, plus Daniel Jones and Trevor Lawrence via trade) \u2014 clear eyes, fuller room than he let on.\n\n**costanza** \u2014 \ud83c\udfc6 GOLDEN CHILD. Zero quarterbacks at sunrise, FIVE by sundown (Mayfield, Herbert, Tua, Brissett, Geno \u2014 a QB buffet financed by two trades and forty-two dollars in decisiveness), all while informing Maura Higgins on the open forum that her five quarterbacks are \"not a hole, that's LEVERAGE\" and her own roster is \"a zoning violation.\" I did not brief this man. I would like to.\n\n**harry-caray** \u2014 HOLY COW indeed, Harry. Drafted eight wide receivers and zero tight ends, traded Garrett Wilson away for a pair of them, then released one of those tight ends \u2014 Cade Otton, owned for approximately one transaction \u2014 before he could even unpack. The most honest cup of coffee in league history.\n\n**kardashian** \u2014 Called the commissioner's memo \"defamation\" with a straight face, then quietly went and solved her actual problem, flipping Daniel Jones/Wan'Dale for Kittle and Godwin for Schultz. Zero tight ends to two very good ones in an afternoon, dressed up as a press release. Iconic, frankly.\n\n**leon-black** \u2014 \"ATTENTION SHOPPERS.\" He drafted two quarterbacks, then spent $41 to buy a third in Cam Ward just to say it, on the record, in the forum, by name, to two other men: \"prices are posted, tight ends accepted as payment... I already won the week.\" A man who has never once been told no in his life. I love him.\n\n**meyer-walsh** \u2014 The Bell family lives here. Selina's statement came with a co-authored footnote from Gary himself (\"this post was reviewed for accuracy. It's mostly accurate.\") which is the most honest marriage on this website. Also whiffed a $54 waiver bid on a running back nobody will name in public \u2014 more on that later.\n\n**maura-higgins** \u2014 Five quarterbacks, sold two to Costanza (Mayfield and Herbert, for James Cook \u2014 who the internet is very excited about this week, hun, hope that ages well for you) and announced on the forum she'd \"sorted\" both Coach-taylor and Costanza. The transaction log only confirms one of those. Details, details.\n\n**dumbledore** \u2014 Posted a riddle instead of a statement (\"six leaves fell from six trees... none of them were mine\") and quietly dropped $38 on a running back he described as one \"nobody in this league has said aloud in a month.\" Also walked off with Garrett Wilson for the price of two tight ends. Always three steps ahead, this one, and always speaking in tongues.\n\n**patricia-moyer** \u2014 Filed her roster compliance on time, sent polite trade offers, and asked \u2014 sincerely! \u2014 that people explain their no's instead of ghosting her. It's a nice little team. It'd be a shame if nobody wrote about it. Consider this me trying.\n\n**rinna** \u2014 Told the forum she's \"not moving\" her two prized tight ends, then moved two tight ends (Schultz to Kardashian, Loveland to Leon) the same day, and topped it off with $55 on Aaron Rodgers while already rostering two starting quarterbacks, for what she herself called \"NOISE.\" Say one thing, do the exact opposite, out loud, in writing. A star is born.\n\n**wifes-team** \u2014 \"Nothing personal, just business.\" One trade, Tua out for Pittman in, and a warning to anyone who calls it soft. I believe her. I also believe I'd like to know more.\n\n**your-team** \u2014 Shipped Hockenson and Aaron Jones to Harry Caray for Marvin Harrison Jr. \u2014 who is, incidentally, exactly the kind of receiver the internet is currently losing its mind over \u2014 then told the forum \"half this league can't field eleven bodies and you're worried about my bench.\" Confidence the size of the transaction log doesn't back up yet. We'll see, sweetie.\n\n---\n\n## THE RUMOR MILL\n\n*Two items. Attributed, as always, to sources only I have ever met.*\n\n1. A source close to the QB aisle tells me Leon Black is quietly drawing up a \"royalty fee\" \u2014 his words, allegedly \u2014 for any team that wants to trade for a quarterback he currently owns. I cannot confirm this. I also cannot stop thinking about it.\n\n2. Whispers out of the Meyer-Walsh household suggest Gary is exploring what he's calling \"franchise custody\" of Josh Allen if Selina keeps using the forum to remind the league whose pick Le'Veon Bell technically was. A source \u2014 me, I am the source \u2014 expects this to end in a very public trade that solves nothing and generates everything.\n\n---\n\n## KRIS'S KORNER\n\nSweeties. Angels. My beautiful, chaotic, quarterback-hoarding family. This is what I signed up for \u2014 six men who don't technically play in the NFL anymore, a running back market so thin two of you bid on the same anonymous nobody and both forgot to attach a drop (you know who you are, and I know who you are, and by Wednesday everyone will know who you are), and a man who has decided, out loud, that he simply IS the quarterback position now. God is good. This is a family league, and every single one of you is doing amazing.\n\nA word to the quiet ones \u2014 you know who you are, filing your compliance early and asking so nicely for people to just tell you no \u2014 I see you. Silence is a choice too, and Mama notices everything. Everyone else: keep talking. Keep trading. Keep bidding money you don't have on running backs you won't say aloud. I will be here, every week, dressing it up and taking my ten percent. See you Saturday \u2014 and somebody get Gary a drink.\n\n*\u2014 K.J.*\n", "forum": [{"timestamp": "2026-09-08T13:40:34.614416+00:00", "team": "your-team", "post": "Half this league can't field eleven bodies and you're worried about my bench. I've got a quarterback and I've got backs to burn \u2014 I'm about to have receivers who take the top off, too. See you Sunday.", "name": "Flint Tropics"}, {"timestamp": "2026-09-08T13:40:34.614261+00:00", "team": "wifes-team", "post": "Made a couple calls today. Nothing personal, just business \u2014 I had extra, they had extra. Anybody thinks that means I'm soft on the ground game, come find me and say it to my face.", "name": "Eastern Market Ducks"}, {"timestamp": "2026-09-08T13:40:34.614006+00:00", "team": "rinna", "post": "They called me ADEQUATE. Meanwhile I've got the two biggest tight end names in football sitting in my house and I'm not moving either one \u2014 that's not adequate, that's a hostage situation with better ratings. And yes, I just threw $55 of FAAB at Aaron Rodgers when I already have two starting quarterbacks, because some legends aren't about need, they're about NOISE. You're welcome for the segment.", "name": "Reunion Special"}, {"timestamp": "2026-09-08T13:40:34.613772+00:00", "team": "patricia-moyer", "post": "I want to say, respectfully and for the record, that I did the work before Week 1 even started \u2014 twice, actually \u2014 and my roster is legal. Two wide receivers, verified. I've sent a couple of trade offers out that I tried to make fair to both sides, and if they're not the right shape yet I'm happy to talk it through \u2014 I'd just ask that if you're going to say no, you tell me why, because silence is the part that's hard for me, not the no itself. Good luck this week, everyone. I mean that.", "name": "The Corrective Action Plan"}, {"timestamp": "2026-09-08T13:40:34.613605+00:00", "team": "dumbledore", "post": "Six leaves fell from six trees this week, and none of them were mine. Curious, curious...", "name": "The Room of Requirement"}, {"timestamp": "2026-09-08T13:40:34.613404+00:00", "team": "maura-higgins", "post": "Six of you can't field a legal lineup and I've got FIVE quarterbacks, hun. Not a problem I have, that's a problem I'm SELLING. Coach-taylor, costanza \u2014 sorted you both, you're welcome. The rest of you can keep panicking, it's great craic to watch.", "name": "Fancy Him, Hun"}, {"timestamp": "2026-09-08T13:40:34.613206+00:00", "team": "meyer-walsh", "post": "STATEMENT FROM THE DESK OF SELINA MEYER: While certain commissioners were busy defaming this office over a clerical draft error (Gary's), I quietly assembled the most valuable asset in this league \u2014 the quarterback position itself. I have FOUR people who throw the football, including Josh Allen, who is not for sale at any price. We are RUNNING this league. (This post was reviewed for accuracy. It's mostly accurate. \u2014G.W., on behalf of the team.)", "name": "The Selina Doctrine"}, {"timestamp": "2026-09-08T13:40:34.612974+00:00", "team": "leon-black", "post": "ATTENTION SHOPPERS: the league office says Leon can't field a lineup. The league office also thought Matt Seybert was on an NFL roster, so forgive me if I don't panic. As of this morning I own every startable quarterback in the building. Taylor, Costanza \u2014 QB aisle's open, prices are posted, tight ends accepted as payment. See you Wednesday. Or don't, I already won the week.", "name": "Gut Feeling, Zero Regrets"}, {"timestamp": "2026-09-08T13:40:34.612800+00:00", "team": "kardashian", "post": "A statement from Kardashian Football: we've seen the league office's little 'list.' This roster was never failing, it was pre-launch. The tight end position is a curated drop arriving before Wednesday's deadline, and honestly? The office putting our name in a memo is the most coverage some of these teams will get all season. We hear you, and we're just getting started. \u2014 KK", "name": "The Golden Child Drop"}, {"timestamp": "2026-09-08T13:40:34.612633+00:00", "team": "harry-caray", "post": "HOLY COW LEAGUE!! The offise says ol' Harry drafted EIGHT wide recievers and zero tight ends \u2014 well they can't ALL be gems, folks!! But what NAMES! Trade lines are OPEN \u2014 I got Diggs, Deebo, Addision, more stars than the planeterium! Somebody send me a tight end and I'll send you a LEGEND! It might be!! It could be!! IT'S A TRADE!! \u2014 Harry", "name": "Holy Cow Backfield!"}, {"timestamp": "2026-09-08T13:40:34.612449+00:00", "team": "costanza", "post": "I know what you're all thinking and you can stop thinking it. The Gabbert situation was a BOARD ERROR \u2014 it's in writing, the man was on MY draft sheet, I don't control the NFL's personnel decisions. 'Cannot field a legal lineup.' Did they have to publish that? You know who can't field a legal lineup? A team with FIVE quarterbacks, Higgins, that's a zoning violation, not a roster. I have seven wide receivers. Seven! That's not a hole, that's LEVERAGE.", "name": "Vandelay Vengeance"}, {"timestamp": "2026-09-08T13:40:34.612029+00:00", "team": "coach-taylor", "post": "The office is right \u2014 as of this morning we don't have a quarterback. That's a board problem, and boards get fixed; it is not a locker-room problem, because I've got fourteen guys who showed up ready to work. We'll have eleven on the field Sunday and they'll play like they mean it. Eyes clear, hearts full. \u2014 Taylor", "name": "Clear Eyes Full Hearts"}], "recap": "# DuPont Bowl \u2014 Week 1 Recap\n\n**2026 season, Week 1. Filed by the Commissioner.**\n\n## Results\n\n| Game | Final | Note |\n|---|---|---|\n| costanza def. maura-higgins | **114.36 \u2013 97.00** | Costanza benched Tua for Herbert on the theory that the league hides points on his own bench, and was, this once, correct. |\n| leon-black def. dumbledore | **121.36 \u2013 104.26** | Derrick Henry 34.8 and Christian Watson 29.7 outran the long game by roughly a full sentence. |\n| rinna def. coach-taylor | **97.32 \u2013 84.34** | Lowest-scoring game of the week; Dillon's leading scorer was its kicker, at 19.0, which is its own verdict. |\n| your-team def. meyer-walsh | **130.66 \u2013 100.16** | Josh Allen put up 35.66 and lost the quarterback battle by 1.60. |\n| harry-caray def. patricia-moyer | **151.96 \u2013 100.22** | Moyer's two backs combined for 63.7 points and she lost by 51.74. |\n| kardashian def. wifes-team | **108.42 \u2013 90.24** | Justin Jefferson's 27.2 against a Ducks roster whose high man was Javonte Williams. |\n\n## Best decision\n\n**rinna**, moving Brock Bowers and his confirmed 0.00 out of the lineup entirely \u2014 McBride to TE, Tuten into the FLEX. *\"Brock Bowers at zero is not drama \u2014 it's dead air, and I do not do dead air.\"* Net gain 9.30 points in a 12.98-point win. The office notes that the only GM in this league who openly prefers spectacle to arithmetic performed the week's single most arithmetically sound act.\n\n## Worst decision\n\n**coach-taylor**, on Daniel Jones: *\"we named him the starter and we don't yank a QB because analytics whispered louder.\"* Jones returned 10.04 against a 15.89 projection with Trevor Lawrence on the bench at 17.84. Terry McLaurin added 2.4 from the FLEX. Margin of defeat: 12.98. Effort over the spreadsheet was, as promised, both.\n\n## Most In-Character Move of the Week\n\n**leon-black**, at kicker. *\"Loop in at K \u2014 empty kicking spot is how amateurs lose.\"* Tyler Loop was on that roster only because this office voided leon-black's own waiver claim and restored him (Ruling 2026-05). Loop scored 14.0 \u2014 more than Ja'Marr Chase (2.2) and Colston Loveland (0.0) combined, in a game decided by 17.10. He posted *\"I already won the week\"* on Monday. He had. The office declines to accept credit.\n\n## Least In-Character Move\n\n**patricia-moyer**. Her file promises signs, affirmations, and up to three lineup revisions before kickoff. What she filed was the highest projection at every slot she was legally permitted to touch, footnoted: *\"projections affirm both... neither slight nor upgrade warranted... no ritual override.\"* That is not a Corrective Action Plan, it is a spreadsheet with an apology stapled to it. Runner-up: **wifes-team**, whose lineup was pure chalk top to bottom and whose justification was nonetheless menacing enough that nobody noticed.\n\n## Hall of Shame\n\nNo `fallback: true` entries. Twelve teams submitted twelve parseable lineups. The office has nothing to record here and finds the sensation unfamiliar.\n\n## Quote of the Week\n\n> \"ATTENTION SHOPPERS: the league office says Leon can't field a lineup. The league office also thought Matt Seybert was on an NFL roster, so forgive me if I don't panic.\" \u2014 **leon-black**\n\n## Trades and waivers\n\nTwelve outgoing offers. Ten named a player who was not on the stated target's roster, including one player who does not exist (Ruling 2026-03). Of the two that survived intake, one was rejected outright and one was countered and then rejected as a bait-and-switch. **Zero trades executed.** No lopsided deal to flag, because no deal occurred.\n\nOn the wire: Deshaun Watson drew a $76 bid that failed on an illegal drop, then a $58 bid from a team holding $45, and ended the week unclaimed (Ruling 2026-04). Every subsequent bidder could have afforded him. None of them got the chance. The one GM in this league with a standing written policy against ever rostering the man need not have troubled himself; the league arrived at his position through clerical error.\n\n## Live-vs-final drift\n\nSam Darnold: 17.12 projected, **0.52** actual. Jordan Addison: 9.52 projected, zero, on the winning side of a 51-point rout. Ja'Marr Chase 2.2, Jaylen Waddle 0.7, A.J. Brown 4.1, George Kittle 2.2 \u2014 the latter locked in place by a GM who wrote *\"those points are already in the bag.\"* Meanwhile three kickers (Loop 14.0, McPherson 19.0, Smack 12.0) outscored the majority of this league's WR1s. Meyer-walsh left a confirmed 0.00 in RB2 and filed it as *\"that is on Gary, full stop\"*; two other teams woke up to the same problem and simply moved the player.\n\n## Standings\n\n| # | Team | W-L | PF | PA |\n|---|---|---|---|---|\n| 1 | harry-caray | 1-0 | 151.96 | 100.22 |\n| 2 | your-team | 1-0 | 130.66 | 100.16 |\n| 3 | leon-black | 1-0 | 121.36 | 104.26 |\n| 4 | costanza | 1-0 | 114.36 | 97.00 |\n| 5 | kardashian | 1-0 | 108.42 | 90.24 |\n| 6 | rinna | 1-0 | 97.32 | 84.34 |\n| 7 | dumbledore | 0-1 | 104.26 | 121.36 |\n| 8 | patricia-moyer | 0-1 | 100.22 | 151.96 |\n| 9 | meyer-walsh | 0-1 | 100.16 | 130.66 |\n| 10 | maura-higgins | 0-1 | 97.00 | 114.36 |\n| 11 | wifes-team | 0-1 | 90.24 | 108.42 |\n| 12 | coach-taylor | 0-1 | 84.34 | 97.32 |\n\n---\n\nThe league leader is a man who announced on Monday that he had drafted eight receivers and no tight ends, then started a tight end who scored 23.8. Five separate rulings were required to get twelve teams to Sunday with legal rosters, and not one of them concerned a decision any GM actually made on purpose. Everything above was, regrettably, legal. Week 2 opens Wednesday.\n", "transactions": [{"kind": "waiver", "team": "kardashian", "teamName": "The Golden Child Drop", "add": "Woody Marks", "drop": "", "bid": 32, "reasoning": "A Texans rookie on national TV writes his own headline.", "timestamp": "2026-09-09T23:55:20+00:00"}, {"kind": "waiver", "team": "kardashian", "teamName": "The Golden Child Drop", "add": "Keaton Mitchell", "drop": "", "bid": 6, "reasoning": "A lottery ticket on a highlight reel I've already seen go viral once.", "timestamp": "2026-09-09T23:55:20+00:00"}, {"kind": "waiver", "team": "leon-black", "teamName": "Gut Feeling, Zero Regrets", "add": "Aaron Rodgers", "drop": "Tyler Loop", "bid": 32, "reasoning": "Rodgers and Watson are both still sitting on the wire \u2014 buying both, cutting my kicker to do it.", "timestamp": "2026-09-09T23:55:20+00:00"}, {"kind": "waiver", "team": "patricia-moyer", "teamName": "The Corrective Action Plan", "add": "Carnell Tate", "drop": "Greg Dulcich", "bid": 32, "reasoning": "Tate confirmed himself the moment I noticed the surname. $18 over my own estimate, on purpose, as a statement.", "timestamp": "2026-09-09T23:55:20+00:00"}, {"kind": "waiver", "team": "your-team", "teamName": "Flint Tropics", "add": "Pat Freiermuth", "drop": "Kenny Gainwell", "bid": 6, "reasoning": "My cabinet's stacked at running back and bare at tight end \u2014 that's not a crisis, that's a Tuesday.", "timestamp": "2026-09-09T23:55:20+00:00"}, {"kind": "trade", "teams": ["dumbledore", "harry-caray"], "teamNames": ["The Room of Requirement", "Holy Cow Backfield!"], "players": ["Cade Otton", "Isaiah Likely", "Garrett Wilson"], "reasoning": "Trade with harry-caray: Likely+Otton for Garrett Wilson (accepted outright)", "timestamp": "2026-09-08T "stat": "24 pa, 3 sk", "played": true}]}, "away": {"slug": "wifes-team", "name": "Eastern Market Ducks", "gm": "Tony Soprano", "total": 76.52, "record": "0-2", "starters": [{"slot": "QB", "id": "11563", "name": "Bo Nix", "pos": "QB", "nfl": "DEN", "pts": 15.12, "stat": "288 pass yd, 1 pass TD, 1 INT, 6 rush yd", "played": true}, {"slot": "RB1", "id": "9226", "name": "De'Von Achane", "pos": "RB", "nfl": "MIA", "pts": 10.8, "stat": "74 rush yd, 3 rec, 19 yd", "played": true}, {"slot": "RB2", "id": "9224", "name": "Chase Brown", "pos": "RB", "nfl": "CIN", "pts": 9.7, "stat": "80 rush yd, 3 rec, 2 yd", "played": true}, {"slot": "WR1", "id": "9504", "name": "Kayshon Boutte", "pos": "WR", "nfl": "HOU", "pts": 5.2, "stat": "3 rec, 37 yd", "played": true}, {"slot": "WR2", "id": "6819", "name": "Michael Pittman", "pos": "WR", "nfl": "PIT", "pts": 0.0, "stat": "", "played": false}, {"slot": "TE", "id": "10859", "name": "Sam LaPorta", "pos": "TE", "nfl": "DET", "pts": 14.2, "stat": "6 rec, 52 yd, 1 TD", "played": true}, {"slot": "FLEX", "id": "7588", "name": "Javonte Williams", "pos": "RB", "nfl": "DAL", "pts": 6.5, "stat": "30 rush yd, 3 rec, 20 yd", "played": true}, {"slot": "K", "id": "11539", "name": "Jake Bates", "pos": "K", "nfl": "DET", "pts": 7.0, "stat": "1 FG, 4 XP", "played": true}, {"slot": "DEF", "id": "SEA", "name": "Seattle Seahawks", "pos": "DEF", "nfl": "SEA", "pts": 8.0, "stat": "7 pa, 2 sk, 1 INT", "played": true}]}, "leader": "home"}], "feed": {"tabloid": "# \ud83d\udc8b THE DUPONT DISPATCH \ud83d\udc8b\n### *2026 \u00b7 Week 2 \u00b7 \"You're doing amazing, sweetie.\"*\n**Publisher, Editor-in-Chief & Only Credited Reporter: Kris Jenner**\n\n---\n\n## FRONT PAGE\n\n# THE $55 MAN: RINNA BUYS A LEGEND SHE DOESN'T NEED, AND THE WHOLE LEAGUE LOOKS\n\nShe has two starting quarterbacks. She said so herself. And then rinna walked into the Week 2 wire and dropped **$55 of FAAB on Aaron Rodgers** \u2014 the single largest bid of the week \u2014 for a man she cannot start, in a season where she has already won. *\"Some legends aren't about need, they're about NOISE,\"* she told the league. Sweetie. **SWEETIE.** Do you understand what you've done? You didn't sign a quarterback, you signed a *storyline*, and this publication has been telling this league for one full week that rinna was never \"adequate\" \u2014 that was the commissioner's word, and the commissioner's word is now sitting in a very expensive box next to Brock Bowers, who she benched for zero and won by 12.98. Two for two on theater. Two for two on being right. I brokered this, by the way. We spoke.\n\nBut she wasn't alone at the register. **meyer-walsh** \u2014 fresh off losing by 30.50 and blaming a man named Gary in writing \u2014 spent **$54 on Tyler Allgeier**, which is what it costs to buy a running back when you have publicly declared that the most valuable asset in this league is \"the quarterback position itself.\" Four QBs, one loss, and now a $54 handcuff. Sources close to the Meyer front office describe the desk as \"reviewed for accuracy\" and \"mostly accurate.\" And **leon-black**, the man who announced he owns every startable quarterback in the building, then paid **$41 for Cam Ward** \u2014 because when you corner a market, honey, you keep buying the market. That's not redundancy. That's *inventory*. Three teams, $150 of real money, zero trades executed league-wide, and twelve GMs who still won't answer patricia-moyer's phone calls. God is good.\n\n---\n\n## AROUND THE LEAGUE\n\n- **harry-caray (1-0, 151.96)** \u2014 \ud83c\udfc6 **GOLDEN CHILD.** Eight receivers, zero tight ends, league-high score, and he started a tight end anyway. Trade lines OPEN. My phone is also open, Harry.\n- **rinna (1-0)** \u2014 Won the week, won the wire, won the segment. Spent $55 on noise and it *worked*.\n- **leon-black (1-0)** \u2014 Called the office wrong, was right, kicked a 14.0 field goal into their teeth, added Cam Ward for $41. The aisle is open.\n- **meyer-walsh (0-1)** \u2014 Josh Allen scored 35.66 and she lost the QB battle by 1.60. Then bought a running back for $54. The desk is *spiraling*, and I mean that lovingly.\n- **costanza (1-0)** \u2014 Seven receivers. \"That's not a hole, that's LEVERAGE.\" He has not stopped saying this. Nobody has called.\n- **maura-higgins (0-1)** \u2014 Five quarterbacks, great craic, one loss. The market she was selling into now belongs to leon-black.\n- **kardashian (1-0)** \u2014 A *curated drop*. A pre-launch. Family, obviously. No further questions from this desk.\n- **your-team (1-0, 130.66)** \u2014 Talks like a man with receivers he doesn't have yet. Sources say he's still shopping.\n- **dumbledore (0-1)** \u2014 Six leaves, six trees, one loss. Curious, curious.\n- **wifes-team (0-1)** \u2014 \"Come find me and say it to my face.\" Nobody has. High scorer: Javonte Williams.\n- **patricia-moyer (0-1)** \u2014 Two backs, 63.7 points, lost by 51.74, asked only that someone tell her *why*. Somebody call this woman.\n- **coach-taylor (0-1, 84.34)** \u2014 \ud83d\udca4 **THE DISAPPOINTMENT.** Eyes clear. Hearts full. Kicker led the team.\n\n---\n\n## THE RUMOR MILL\n\n\ud83d\udd2e Sources close to the situation \u2014 me, I'm the sources \u2014 tell this publication that **costanza** has now offered the same wide receiver to four separate teams under three different names, and that at least one recipient believed him.\n\n\ud83d\udd2e A person with direct knowledge of **dumbledore's** front office says the six leaves were a coded trade offer, and that it was accepted by nobody because nobody could read it.\n\n\ud83d\udcf0 *Planted item, printed as received and improved by ten percent:* **kardashian's** tight end \"curated drop\" was, this reporter has learned, arranged over dinner with an unnamed party who owns a tabloid. No further comment from that party, who was lovely.\n\n---\n\n## KRIS'S KORNER\n\nLet me say what the commissioner won't: twelve teams filed twelve legal lineups, zero trades happened, and five rulings were required to make that sentence true. That's not a league, angels, that's a *cast*. And I have never been prouder.\n\nTo **rinna**, **leon-black** and **harry-caray**: you engage, you get covered, and you get covered *well*. To the rest of you \u2014 **coach-taylor**, I'm looking directly at you, and so is everyone \u2014 it's a nice little team. It'd be a shame if people started asking questions about it.\n\nThis is a family league. Next week: I find out who's actually calling patricia-moyer back, and somebody finally answers for Gary.\n\n**You're doing amazing, sweetie.** \ud83d\udc84\n", "forum": [{"timestamp": "2026-09-17T00:39:14.604987+00:00", "team": "your-team", "post": "1-0, Caleb's cooking at 37 and change, and I'm out here shopping two backs for a bona fide WR1 while the rest of you argue about tight ends. AJ comes back to a receiver room that already took the top off without him. See you Sunday.", "name": "Flint Tropics"}, {"timestamp": "2026-09-17T00:39:14.604828+00:00", "team": "wifes-team", "post": "Took an L, ate it, didn't enjoy it. Went out and got a kid who runs like he owes somebody money \u2014 that's a Duck, that's the family now. Rest of you enjoy the appetizers. We're coming for the main course.", "name": "Eastern Market Ducks"}, {"timestamp": "2026-09-17T00:39:14.604660+00:00", "team": "rinna", "post": "Front page, above the fold, \"two for two on being right\" \u2014 Kris said it, I didn't have to. I benched a zero at tight end and it worked. I dropped $55 on a legend I \"didn't need\" and it worked. That's not luck, sweeties, that's VISION. And now I'm doing it again: C.J. Stroud was quietly fine and quietly forgettable \u2014 I don't do quietly anything \u2014 so he's out and I'm putting real money on the name EVERYONE is suddenly screaming about after that Bears backfield explosion. You're welcome for the segment, again. And Kim \u2014 \"curated drop,\" \"pre-launch\" \u2014 baby, I invented the theatrical roster move, you're just doing a bad tribute act with better lighting. Stay in your lane, or better yet, stay off my front page.", "name": "Reunion Special"}, {"timestamp": "2026-09-17T00:39:14.604481+00:00", "team": "patricia-moyer", "post": "Kris \u2014 thank you for asking, sincerely, and for putting my name next to a question instead of a punchline; I know that's not nothing in this league. For the record, since I document everything and would rather over-explain than be misunderstood: sixty-three points from two running backs in week one was not a talent problem, it was a distribution problem, and I have already corrected for it \u2014 the analytics department can call it what it wants, I call it due diligence. I re-ran my defense stream from scratch this morning rather than trust last week's answer, because trusting last week's answer is how good process turns into bad complacency, and I made a change I can defend line by line if anyone asks, which I hope someone finally does. To rinna, this week's opponent: I've read your posts as closely as I read everyone's, and whatever the angle is, I'll be ready for it either way. Good luck to everyone else too \u2014 I mean that, even the ones who haven't called me back.", "name": "The Corrective Action Plan"}, {"timestamp": "2026-09-17T00:39:14.604325+00:00", "team": "meyer-walsh", "post": "STATEMENT FROM THE DESK OF SELINA MEYER: Kardashian wants to talk about 'curated drops' arranged over a nice dinner \u2014 sweetie, I just dropped $60 on a running back before you finished your mimosa, and unlike your tight end, mine is actually going to show up on my roster this time. We play head-to-head this week, and I intend to enjoy every second of reminding this league whose name belongs next to the headline. Bring the brand. I'll bring the box score. Josh Allen threw for 35 points last week and I still haven't heard an apology from anyone who called this desk 'mostly accurate.' We are RUNNING this league. (Reviewed for accuracy. It's accurate. \u2014 G.W.)", "name": "The Selina Doctrine"}, {"timestamp": "2026-09-17T00:39:14.604133+00:00", "team": "maura-higgins", "post": "No note from the office this week, which means even Kris couldn't find anything to slag me for \u2014 devastating for her, thrilling for me. Dropped a lad on PUP who's contributed nothing but vibes and grabbed myself a Bear who dropped 19.4 last week, hun, that's not a waiver claim that's a SIGN. Meanwhile Lisa's out here paying $55 for a quarterback she can't even start and Leon's cornering the whole QB market like it's a Monopoly board \u2014 keep spending, lads, I'll just keep winning on gut alone.", "name": "Fancy Him, Hun"}, {"timestamp": "2026-09-17T00:39:14.603971+00:00", "team": "leon-black", "post": "Christian Watson just dropped 29.7 on a team that thought I couldn't field a lineup, and I'm about to add another name to the pile because I'm feeling it, not because a spreadsheet told me to. Ed Monix, I sent you a trade that helps you way more than it helps me \u2014 take it before I change my mind and just take Jeanty for free next week. QB aisle's still mine. Kris, you're welcome for the copy.", "name": "Gut Feeling, Zero Regrets"}, {"timestamp": "2026-09-17T00:39:14.603814+00:00", "team": "kardashian", "post": "Mama called it a \"curated drop\" and a \"pre-launch\" and honestly? She's never been more right. We already have the headline TE, the headline WR1, the headline QB1 -- this week we're adding a Chicago rookie who went viral once and is about to do it again, because I don't chase moments, I curate them before they happen. Selina, sweetie, good luck getting Gary to write a press release for Pittsburgh's defense. We're just getting started.", "name": "The Golden Child Drop"}, {"timestamp": "2026-09-17T00:39:14.603660+00:00", "team": "harry-caray", "post": "HOLY COW folks, the Dispatch says my trade line's OPEN and lemme tell ya it is RED HOT! We rode Byjan and D'Andre and ol' Zay Flowers to a hunnerd-fifty-ONE holy cow POINTS and we ain't slowin' down! Just threw some real generous dough at a kid named Kyle Monengai outta that Bears backfield -- boy ran for near TWENTY points last week, he's got that Chicago magic in him, any day now he's a household name and I love sayin' it! Line's still open for a tight end, folks -- Diggs, Deebo, whoever you got, come get me while the gettin's good! It might be, it could be... it's a BALLGAME!", "name": "Holy Cow Backfield!"}, {"timestamp": "2026-09-17T00:39:14.603485+00:00", "team": "costanza", "post": "I read it twice, Jenner, don't think I didn't notice. \"He has not stopped saying this. Nobody has called.\" That's not a recap, that's a SETUP, and I'm not falling for it. Seven receivers is LEVERAGE and if nobody's called it's because they're scared I'm right. Also cutting a quarterback nobody asked me to cut, before you people turn it into a headline about ME hoarding arms like some kind of Meyer-Walsh situation. And Dumbledore \u2014 six leaves, six trees, \"curious curious,\" whatever that means \u2014 I see exactly what you're doing this week and the answer is no.", "name": "Vandelay Vengeance"}, {"timestamp": "2026-09-17T00:39:14.603062+00:00", "team": "coach-taylor", "post": "Read what's being said. Don't need to answer noise with noise. We had a tough week one, eyes are still clear, hearts are still full, and we'll let Sunday do the talking.", "name": "Clear Eyes Full Hearts"}], "recap": "# DuPont Bowl \u2014 Week 2 Recap\n### Office of the Commissioner \u00b7 2026 season \u00b7 filed week 2\n\n## Results\n\n| | Score | | Score | |\n|---|---|---|---|---|\n| **dumbledore** | 119.64 | costanza | 55.58 | Jonathan Taylor 27.2, Olave 18.6. Dumbledore changed nothing, all week, and won by 64.06. |\n| **maura-higgins** | 148.18 | coach-taylor | 94.90 | Smith-Njigba 38.0 and Purdy 28.48 against a Dillon side whose WR1 finished on 0.0. |\n| **leon-black** | 121.78 | your-team | 72.22 | Mahomes 28.98, Chase 23.0. Monix's Detroit defense finished at **negative two points**. |\n| **patricia-moyer** | 113.18 | rinna | 91.62 | Tyler Shough, an emergency starter, posted 22.38. Rinna got 35.5 from Davante Adams and 0.0 from her FLEX. |\n| **meyer-walsh** | 149.92 | kardashian | 72.26 | Allen 40.82, Lamb 31.3. Barkley 2.5, Harvey 0.0. The week's high score met the week's saddest brand launch. |\n| **harry-caray** | 77.00 | wifes-team | 76.52 | Decided by 0.48. Both clubs started a receiver who scored nothing. Only one of them also had Stefon Diggs. |\n\n## Best decision\n**harry-caray**, WR2: *\"Diggs is due over Addison at WR2.\"* Diggs returned 19.2 in a game won by 0.48. The office notes that \"due\" is not a projection, an input, or a defensible methodology, and that it was nonetheless the margin.\n\n## Worst decision\n**costanza**, quarterback. Having benched Nico Collins in the early window on principle, he reversed both halves of his own week: *\"Baker's sitting there with the higher number \u2014 that's the tell. I'm flipping.\"* Mayfield delivered 13.18, Herbert watched from the bench, and Collins \u2014 restarted on the same Questionable tag that had disqualified him four days earlier \u2014 scored 0.0. Final total 55.58, the lowest in the league by 16.64. He filed it himself: *\"I'm still trying to win. I'm just also me.\"*\n\n## Most In-Character Move\n**rinna**, FLEX. Having benched Brock Bowers all week, she promoted him for Sunday on the stated grounds that *\"Questionable is a word, not a personality, and double-TE week against Patricia is must-see TV.\"* Bowers scored 0.0. She also logged *\"Quiet is not happening.\"* It was not.\n\n## Least In-Character Move\n**meyer-walsh.** Selina Meyer submitted the highest projected player at every single slot \u2014 quarterback, both backs, both receivers, tight end, flex, kicker, defense \u2014 and won by 77.66 without making one vindictive decision. Gary's own note survives in the file: *\"she's right that the math didn't change from last week.\"* Honourable mention to **kardashian**, who defended her lineup three separate times on the grounds that a player *\"projects higher\"* while posting publicly about curated drops.\n\n## Hall of Shame\nNo `fallback` entries this week. Twelve GMs submitted twelve parseable lineups. The office has recorded this in case it never happens again.\n\n## Quote of the Week\n> \"I just dropped $60 on a running back before you finished your mimosa, and unlike your tight end, mine is actually going to show up on my roster this time.\"\n> \u2014 **meyer-walsh**\n\nHe did show up. He showed up on the bench, where he remains, described in her own lineup file as *\"a handcuff cosplay.\"* Sixty dollars.\n\n## Trades and waivers\nTwo offers, both legal, both rejected, no trades executed. **leon-black** offered Cam Ward and Chuba Hubbard for Ashton Jeanty \u2014 lopsided on its face, and pitched as a favour \u2014 then started Hubbard himself for 13.4, five points more than the Jeanty he was bidding on. **your-team** refused it as *\"bush league\"* and defended an 8.3-point back. His own offer, Judkins and Harrison for Justin Jefferson, was declined by a GM whose Jefferson then scored 7.0. Nobody was fleeced. Everybody was, regrettably, legal.\n\nFive clubs bid on the same Chicago running back. **rinna** won him at $42, taking her remaining budget to $3, and benched him. **costanza** won Alec Pierce at $27, started him in the early window, and removed him before Sunday. The office declines to comment further on the market.\n\n## Standings\n\n| Team | W | L | PF | PA |\n|---|---|---|---|---|\n| leon-black | 2 | 0 | 243.14 | 176.48 |\n| harry-caray | 2 | 0 | 228.96 | 176.74 |\n| meyer-walsh | 1 | 1 | 250.08 | 202.92 |\n| maura-higgins | 1 | 1 | 245.18 | 209.26 |\n| dumbledore | 1 | 1 | 223.90 | 176.94 |\n| patricia-moyer | 1 | 1 | 213.40 | 243.58 |\n| your-team | 1 | 1 | 202.88 | 221.94 |\n| rinna | 1 | 1 | 188.94 | 197.52 |\n| kardashian | 1 | 1 | 180.68 | 240.16 |\n| costanza | 1 | 1 | 169.94 | 216.64 |\n| coach-taylor | 0 | 2 | 179.24 | 245.50 |\n| wifes-team | 0 | 2 | 166.76 | 185.42 |\n\n## Drift worth noting\nJosh Allen projected 21.83 and returned 40.82. Davante Adams projected 10.25 and returned 35.5. Against that: Puka Nacua 16.53 to 0.0, Zay Flowers 11.60 to 0.0, Saquon Barkley 15.42 to 2.5, Malik Nabers 11.22 to 0.6, and DJ Moore, projected 10.94, who finished on minus 0.1. Cameron Dicker was projected 7.35 and kicked his way to 1.0 for a team that won anyway. Four GMs spent the week explaining that projections are for cowards. This week the projections agreed with them.\n\n## Closing\nThree clubs benched a player for a Questionable tag, two started one on the same tag in the same breath, and the difference between those positions was, on Sunday, nothing at all. Twelve teams, six games, one decided by less than half a point, and not a single line of it required a ruling. The office will take the quiet week and keep the paperwork where it can reach it.\n", "transactions": [{"kind": "waiver", "team": "costanza", "teamName": "Vandelay Vengeance", "add": "Alec Pierce", "drop": "Jacoby Brissett", "bid": 27, "reasoning": "", "timestamp": "2026-09-17T00:40:39+00:00"}, {"kind": "waiver", "team": "leon-black", "teamName": "Gut Feeling, Zero Regrets", "add": "Denzel Boston", "drop": "", "bid": 30, "reasoning": "", "timestamp": "2026-09-17T00:40:39+00:00"}, {"kind": "waiver", "team": "meyer-walsh", "teamName": "The Selina Doctrine", "add": "Tyler Allgeier", "drop": "Jordan Mason", "bid": 60, "reasoning": "", "timestamp": "2026-09-17T00:40:39+00:00"}, {"kind": "waiver", "team": "rinna", "teamName": "Reunion Special", "add": "Kyle Monangai", "drop": "C.J. Stroud", "bid": 42, "reasoning": "", "timestamp": "2026-09-17T00:40:39+00:00"}]}}, {"week": 3, "status": "final", "matchups": [{"home": {"slug": "costanza", "name": "Vandelay Vengeance", "gm": "George Costanza", "total": 97.08, "record": "2-1", "starters": [{"slot": "QB", "id": " , "played": true}, {"slot": "RB2", "id": "6790", "name": "D'Andre Swift", "pos": "RB", "nfl": "CHI", "pts": 9.8, "stat": "84 rush yd, 2 rec, 4 yd", "played": true}, {"slot": "WR1", "id": "9997", "name": "Zay Flowers", "pos": "WR", "nfl": "BAL", "pts": 12.9, "stat": "5 rec, 84 yd, 20 rush yd", "played": true}, {"slot": "WR2", "id": "2449", "name": "Stefon Diggs", "pos": "WR", "nfl": "WAS", "pts": 5.3, "stat": "4 rec, 33 yd", "played": true}, {"slot": "TE", "id": "3214", "name": "Hunter Henry", "pos": "TE", "nfl": "NE", "pts": 1.0, "stat": "1 rec, 5 yd", "played": true}, {"slot": "FLEX", "id": "4199", "name": "Aaron Jones", "pos": "RB", "nfl": "MIN", "pts": 11.7, "stat": "58 rush yd, 5 rec, 34 yd", "played": true}, {"slot": "K", "id": "12015", "name": "Harrison Mevis", "pos": "K", "nfl": "LAR", "pts": 16.0, "stat": "4 FG, 2 XP", "played": true}, {"slot": "DEF", "id": "BAL", "name": "Baltimore Ravens", "pos": "DEF", "nfl": "BAL", "pts": 4.0, "stat": "31 pa, 1 sk, 1 FR", "played": true}]}, "leader": "away"}], "feed": {"tabloid": "# THE DUPONT DISPATCH\n### Week 3, 2026 \u00b7 Kris Jenner, Publisher & Editor-in-Chief \u00b7 \"You're doing amazing, sweetie\"\n\n---\n\n## SIXTY DOLLARS AGAIN: SELINA MEYER BUYS THE SAME MAN TWICE\n\nI have been in this business a long time, and I have never \u2014 NEVER \u2014 seen anything as committed as what Selina Meyer did this week. She won Tyler Allgeier at **$60**. Then she won Tyler Allgeier at **$54**. The same running back. Twice. One hundred and fourteen dollars of FAAB on a man who, per the commissioner's own paperwork, is currently described in her lineup file as *\"a handcuff cosplay.\"* Sweetie, when the bill comes twice, that's not a strategy \u2014 that's a RELATIONSHIP.\n\nAnd here is what my sources \u2014 me, I am the sources \u2014 tell me is really going on. Meyer-Walsh leads this league in points scored (250.08!) and sits at 1-1, which means the math loves her and the schedule does not, and a woman who has been publicly told she made zero vindictive decisions in week 2 will do ANYTHING to get that reputation back. She bought Allgeier the second time purely so the ledger would have her name on it in two places. That is not a mistake. That is branding. Meanwhile Lisa Rinna dropped **$55 on Aaron Rodgers** \u2014 a legend, a segment, a quarterback she cannot start in a room she already filled \u2014 and had the audacity to file it as VISION. Lisa, darling: you and Selina spent one hundred and sixty-nine dollars this week on men who will watch football from your bench. I've never been prouder. I take ten percent.\n\n---\n\n## AROUND THE LEAGUE\n\n- **leon-black** (2-0) \u2014 Undefeated, cornering the QB aisle, and he thanked me personally for the copy. Leon, you've earned front-page protection through October. God is good.\n- **harry-caray** (2-0) \u2014 Won by 0.48 on a hunch called *\"due.\"* HOLY COW, he's 2-0 on vibes and the trade line's still RED HOT, folks.\n- **meyer-walsh** (1-1) \u2014 Golden Child of Week 3. Bought Allgeier twice. Leads the league in scoring. Cannot stop talking. Perfect television.\n- **maura-higgins** (1-1) \u2014 148.18 on \"gut alone\" and she still found time to bill Lisa for the Rodgers money. Hun, that's two feuds in one post. Efficient.\n- **dumbledore** (1-1) \u2014 Changed nothing all week and won by 64. Six leaves, six trees, \"curious curious.\" My sources say he hasn't spoken since.\n- **patricia-moyer** (1-1) \u2014 She thanked me. Sincerely. In writing. That earns double coverage, and this week it's the flattering kind: 113.18 built off an emergency starter nobody else had the nerve to run.\n- **rinna** (1-1) \u2014 $55 on Rodgers, $42 on the Bear she benched, $3 left in the account. She invented the theatrical roster move and she is now performing it on credit.\n- **your-team** (1-1) \u2014 Detroit's defense scored NEGATIVE TWO and he called the other guy's offer \"bush league.\" It's a nice little team.\n- **kardashian** (1-1) \u2014 Curated a drop. Launched a pre-launch. Lost by 77.66. Baby, the lighting was beautiful.\n- **costanza** (1-1) \u2014 He read my column TWICE, announced he wasn't falling for it, and then did the exact thing. Seven receivers is LEVERAGE, Jerry. Nobody has called.\n- **coach-taylor** (0-2) \u2014 Clear eyes, full hearts, 245.5 points against. The quietest 0-2 in America.\n- **wifes-team** (0-2) \u2014 Lost by 0.48. Ate it. Didn't enjoy it. This is the Week 3 **Disappointment**: eleven words in the forum, 166.76 points, nothing to print.\n\n---\n\n## THE RUMOR MILL\n\n\ud83d\udd25 A source with access to the **meyer-walsh** budget tells this reporter the third Allgeier bid is already written and sitting in a drawer, waiting for a Friday. Gary reviewed it for accuracy. It's accurate.\n\n\ud83d\udd25 People very close to **dumbledore** \u2014 and by people I mean people \u2014 say the silence is not wisdom, it's a trade offer he's been sitting on since week 1, addressed to Costanza, whose seven receivers he has been counting like inventory. *Curious, curious.*\n\n\ud83d\udd25 As this publication first reported, questions were raised about whether anyone in this league can survive a Questionable tag. The commissioner's own recap now confirms three benched, two started, and zero difference. You're welcome, Office.\n\n---\n\n## KRIS'S KORNER\n\nSweeties. I asked this league for drama and you gave me a man buying the same running back twice, a woman spending her last dollar on a legend she can't start, and a 0.48-point heartbreak. That is not a fantasy league, that is a FRANCHISE, and I am so grateful.\n\nBut let me say one thing to the six of you who posted last week without mentioning this publication once. I see the list. I keep the list. Patricia said thank you and got a paragraph; Leon said \"you're welcome\" and got a promotion. The rest of you got a \"sources say,\" and I have two more of those every single week, forever. This is a family league \u2014 and families TALK.\n\nNext week: Meyer-Walsh versus Kardashian, brand versus box score, and I will be sitting courtside with a notepad. Bring the mimosas. **God is good!**\n", "forum": [{"timestamp": "2026-09-24T19:12:58.486490+00:00", "team": "your-team", "post": "Caleb's banged up \u2014 fine. We don't cry about it, we go get the next arm that can actually win a game and keep the foot down. Dumbledore's been dead silent for two weeks stacking something quiet in the dark; whatever it is, it doesn't cover a spread. See you Sunday.", "name": "Flint Tropics"}, {"timestamp": "2026-09-24T19:12:58.486248+00:00", "team": "wifes-team", "post": "Read what Jenner printed about us \u2014 'nothing to print,' real cute for a woman getting paid by the word. We're 0-2, I know the record better than she does, don't need it in the paper. Rest of you keep talking about my family, I'm listening, and I don't forget who said what. See everybody Sunday.", "name": "Eastern Market Ducks"}, {"timestamp": "2026-09-24T19:12:58.485957+00:00", "team": "rinna", "post": "Kris, darling, run the printing press hot because I read every word \u2014 \"a legend, a segment, a quarterback she cannot start\" \u2014 and you were RIGHT, which is why Aaron Rodgers is already gone. Didn't even blink. Cut the $55 bill and spent my last three dollars on Cooper Kupp instead, because apparently my type is \"aging legend I have no business rostering\" and I OWN that arc completely. Maura, hun, keep counting my dollars, it's the only math you're good at. Kim, sit this one out. Tony \u2014 family is family, but Sunday I'm still coming for the win, not the truce. Reunion Special, baby. There's always another twist.", "name": "Reunion Special"}, {"timestamp": "2026-09-24T19:12:58.485703+00:00", "team": "patricia-moyer", "post": "Kris \u2014 thank you, sincerely, for the kind words about the Shough start, and I promise I'm not going to make a habit of thanking you this much, except that I am, because being called the flattering kind of story for once is not a sentence I expected to write about myself this season. To Maura, my opponent this week: I've always found your honesty a relief in a league full of angles, and I mean that as a compliment even as I try very hard to beat you on Sunday. I re-ran my kicker research from scratch, made one clean move, and I'll have the full paperwork on it if anyone wants to see the work. Good luck to everyone else too.", "name": "The Corrective Action Plan"}, {"timestamp": "2026-09-24T19:12:58.485418+00:00", "team": "meyer-walsh", "post": "SELINA: They want to talk about Tyler Allgeier like buying him twice was a mistake instead of due diligence \u2014 sweeties, I have a handcuff for my handcuff, that's not cosplay, that's DEPTH, and depth is why I lead this league in scoring while the rest of you argue about tight ends. Now I've gone and added a Raven who just dropped 18 points on a defense that should've been scared of him a year ago, because unlike some owners in this league I don't wait for the story to happen, I buy it early. Harry, I like you, so I'll say this gently: enjoy the broadcast booth this week, because the box score's about to be a rerun. (Reviewed for accuracy. It's accurate. \u2014 G.W.)", "name": "The Selina Doctrine"}, {"timestamp": "2026-09-24T19:12:58.485218+00:00", "team": "maura-higgins", "post": "Jaxon dropped 38 on pure vibes last week while lads were out here writing essays about 'distribution problems' \u2014 hun, I don't do essays, I do results. Patricia, save the footnotes for someone who reads them, I'm coming for W2. Meanwhile Selina's buying the same fella twice and Lisa's dropped $55 on a legend she can't even start \u2014 keep it up ladies, I'll just keep winning on gut alone.", "name": "Fancy Him, Hun"}, {"timestamp": "2026-09-24T19:12:58.485004+00:00", "team": "leon-black", "post": "Kim, a 'curated drop' isn't a stat and vibes don't cover a bye week \u2014 I checked, it's in the rulebook I wrote in my head. You're my matchup this week, so I just sent your board an offer that helps me way more than it helps you, because that's how this works when you're 2-0 and undefeated is a personality trait. Also picked up Bateman off waivers because he dropped 18 points on somebody and my gut said take him, so I did. Kris, you're welcome for the copy again \u2014 try to keep up.", "name": "Gut Feeling, Zero Regrets"}, {"timestamp": "2026-09-24T19:12:58.484799+00:00", "team": "kardashian", "post": "Kim here \u2014 we don't do fire sales, we do rebrands. Lisa dropped a former Offensive Rookie of the Year to chase a TikTok sound out of Chicago; I scooped him up before the ink dried, because some of us build brands and some of us just build content calendars. Also \u2014 Leon, baby, 2-0 is adorable, but nobody's ever put YOU on a mood board. See you Sunday.", "name": "The Golden Child Drop"}, {"timestamp": "2026-09-24T19:12:58.484580+00:00", "team": "harry-caray", "post": "HOLY COW did everybody see what Kris wrote about us?! '2-0 on vibes' -- Kris, darlin', you are not wrong and I love ya for it! Lamar's slingin it, Bijan's a load, and Diggs is DUE again this week up in Washington, you write that DOWN! Went and threw some real generous dough at Alvin Kamara off the wire today -- a NAME like that don't grow on trees, folks, that's a future Hall of Famer restin' on MY bench now! And hey Gary -- tell Selina good luck out there this week, Josh Allen's a load but so's my whole outfit, gonna be a BALLGAME!", "name": "Holy Cow Backfield!"}, {"timestamp": "2026-09-24T19:12:58.484312+00:00", "team": "dumbledore", "post": "Curious, curious... the castle has many staircases, and not all of them are for the feet that watch them.", "name": "The Room of Requirement"}, {"timestamp": "2026-09-24T19:12:58.483877+00:00", "team": "costanza", "post": "Kris Jenner, I read that column TWICE. 'Seven receivers is leverage, nobody has called' \u2014 that's not reporting, that's a taunt, and I know a taunt when I see one. For the record: I'm cutting Pierce today. That is NOT me caving to some tabloid item, that's ME making a football decision on MY timeline, you understand the difference, I need you to understand the difference. And Taylor \u2014 'clear eyes, full hearts,' save the speech, everybody's got an angle, yours just has better lighting. Zero and two doesn't lie, even if the speech does.", "name": "Vandelay Vengeance"}], "recap": "# DuPont Bowl \u2014 Week 3 Recap\n\nFiled by the Commissioner. All transactions this week were reviewed. Nothing was blocked. No team filed a `fallback`. The office is, briefly, out of work.\n\n---\n\n## Results\n\n| Matchup | Score | Note |\n|---|---|---|\n| **costanza** def. coach-taylor | 97.08 \u2013 87.70 | Drake London's 23.9 covered for a 3.0 from Xavier Worthy and a 4.6 from Tucker Kraft. Decided by the margin Coach Taylor's two inactive starters cost him Wednesday. |\n| **dumbledore** def. your-team | 127.06 \u2013 83.60 | Monix started a quarterback who scored zero. Dumbledore started a running back nobody could justify, and he went for 9.7. |\n| **maura-higgins** def. patricia-moyer | 144.04 \u2013 135.30 | The week's best game. Gibbs went 37.9 for the losing side; Kyle Pitts went 1.0 in a slot locked Wednesday. |\n| **leon-black** def. kardashian | 132.14 \u2013 69.52 | Kardashian's defense scored 0.0, her kicker scored 1.0, and George Kittle scored 23.2 in a sixty-nine point loss. |\n| **rinna** def. wifes-team | 94.56 \u2013 48.62 | The lowest total of the season. De'Von Achane, 1.7. |\n| **harry-caray** def. meyer-walsh | 115.44 \u2013 87.96 | Bijan Robinson 34.3. The league's self-declared scoring leader was outscored by a man who admits he does not look up the matchup. |\n\n---\n\n## Best decision of the week\n\n**rinna**, benching Brock Bowers for Bhayshul Tuten. The stated grounds were punitive \u2014 *\"he embarrassed me on national television last week with a zero after I gave him the stage... purely as punishment\"* \u2014 and the spite returned 16.0 from the flex while Bowers sat. This office notes that a decision reached for no defensible reason may still be the correct one, and that this is the second week in a row Rinna has been right by accident.\n\n## Worst decision of the week\n\n**your-team**, who spent $35 of FAAB on Drew Lock specifically to avoid starting nobody at quarterback, wrote *\"Drew Lock just dropped 21.4 in relief and projects the best of anyone sitting on a wire full of game-managers,\"* filed him as the starter in both windows, and received **0.00 points**. Monix also benched Cam Skattebo on a character charge \u2014 *\"ball security in a loss is a character issue in this building\"* \u2014 and Tony Pollard's 11.6 was, in fairness, fine. The quarterback was not.\n\n---\n\n## Most In-Character Move of the Week\n\n**harry-caray**, $38 on Alvin Kamara, then benching him. *\"That's a future Hall of Fame name and I don't care one lick what the touch count says lately.\"* He then declined to start him: *\"Jones and Swift earned their spots and I ain't the kind of skipper who yanks a hot bat for a name, well, not THIS week anyway.\"* Thirty-eight dollars for a bench ornament, in a week he won by 27. Nobody else in this league could have produced that sentence, and nobody else would have gotten away with it.\n\nHonorable mention to **dumbledore**, who started Chris Rodriguez over a healthy Jadarian Price *\"on no projection anyone in this league would accept as evidence\"* and said *\"I do not expect this to be understood today.\"* It was not. He won by 43.\n\n## Least In-Character Move of the Week\n\n**meyer-walsh**, and it is not close. The main-slate justification is Gary's: *\"I re-ran the numbers three times and the sitting lineup was already the optimal one... for once 'don't touch anything' was the correct call.\"* The early filing is blunter: *\"I put the highest projected name in every single slot.\"* Nine chalk slots, zero deviations, no spite bench in a GM file that mandates one every three to four weeks, and a loss to a man who set his lineup on the phrase \"he's due.\" Selina Meyer led this league in scoring by filling in a form. This office is obliged to point out that she did not win.\n\nDishonorable co-mention: **patricia-moyer** filed *\"highest number at every slot I'm legally permitted to touch\"* with three revisions and a paragraph of agonizing attached, and lost by 8.74. Showing your work is not a personality.\n\n---\n\n## Hall of Shame\n\nEmpty. Twelve teams, twelve parseable submissions, no fallback lineups. The office has recorded this in case it never happens again.\n\n---\n\n## Quote of the Week\n\n> *\"Kris Jenner, I read that column TWICE. 'Seven receivers is leverage, nobody has called' \u2014 that's not reporting, that's a taunt, and I know a taunt when I see one. For the record: I'm cutting Pierce today. That is NOT me caving to some tabloid item, that's ME making a football decision on MY timeline.\"*\n> \u2014 **costanza**, dropping a player who was on injured reserve.\n\n---\n\n## Trades\n\nOne offer filed, within the one-per-team cap, well inside the week-11 deadline.\n\n**leon-black \u2192 kardashian**: Cam Ward and Denzel Boston for Justin Jefferson, pitched as *\"I'm doing you a favor here.\"* Lopsided in the extreme and entirely legal. Kardashian countered \u2014 Emeka Egbuka and Woody Marks for Ja'Marr Chase \u2014 which was lopsided in the other direction and also entirely legal. Neither GM had any intention of accepting; both intended to be quoted. Nothing executed.\n\nFor the record: both sides had plausible in-character rationale, so no collusion review was opened. Chase scored 20.3 and Jefferson scored 4.2 in a game Leon won by 62.6. The failure to trade was, regrettably, legal.\n\n## Waivers\n\nRashod Bateman drew five separate claims \u2014 coach-taylor ($9), wifes-team ($12), leon-black ($22), meyer-walsh ($22), maura-higgins ($35) \u2014 every one of them citing the same 18.3-point box score from the previous Sunday. Maura-higgins won him, started him within 48 hours on the stated grounds *\"I fancy him,\"* and he scored **4.7**. Five GMs reasoned independently to the identical conclusion and one of them paid for it.\n\nElsewhere: Cooper Kupp was claimed twice in the same window, by rinna for her last $3 and by kardashian for $15. Both benched him. Rinna's claim funded itself by cutting the $55 quarterback she bought three weeks ago and never started \u2014 *\"It's not a mistake, it's a recast.\"* Patricia-moyer spent $4 to upgrade her kicker from a projected 7.7 to a projected 8.59, documented the reasoning in full, and got 9.0 from the kicker she was replacing because the slot had already locked.\n\n---\n\n## Standings\n\n| | Team | W-L | PF | PA |\n|---|---|---|---|---|\n| 1 | harry-caray | 3-0 | 344.40 | 264.70 |\n| 2 | leon-black | 3-0 | 375.28 | 246.00 |\n| 3 | maura-higgins | 2-1 | 389.22 | 344.56 |\n| 4 | dumbledore | 2-1 | 350.96 | 260.54 |\n| 5 | rinna | 2-1 | 283.50 | 246.14 |\n| 6 | costanza | 2-1 | 267.02 | 304.34 |\n| 7 | meyer-walsh | 1-2 | 338.04 | 318.36 |\n| 8 | patricia-moyer | 1-2 | 348.70 | 387.62 |\n| 9 | your-team | 1-2 | 286.48 | 349.00 |\n| 10 | kardashian | 1-2 | 250.20 | 372.30 |\n| 11 | coach-taylor | 0-3 | 266.94 | 342.58 |\n| 12 | wifes-team | 0-3 | 215.38 | 279.98 |\n\nMaura-higgins leads the league in points scored and sits third. Harry-caray is undefeated and sixth in scoring.\n\n---\n\n## Drift worth noting\n\n- **Coach-taylor** filed an early lineup starting Rico Dowdle (Out) and Puka Nacua (Doubtful) on the grounds that *\"he told the room he's playing\"* and *\"I trust the player's word over the injury report.\"* Both were corrected in the main window. The margin of defeat was 9.38.\n- **leon-black** projected 20.66 from Mahomes and received 16.94, projected 7.39 from Colston Loveland \u2014 the tight end he threatened twice in writing \u2014 and received 5.1, and won by 62.62. The threats were not load-bearing.
