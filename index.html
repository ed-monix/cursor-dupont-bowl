"name": "TreVeyon Henderson", "pos": "RB", "nfl": "NE", "pts": 4.2, "stat": "42 rush yd", "played": true}, {"slot": "WR1", "id": "6786", "name": "CeeDee Lamb", "pos": "WR", "nfl": "DAL", "pts": 32.8, "stat": "17 rec, 189 yd, 1 TD, -6 rush yd", "played": true}, {"slot": "WR2", "id": "7526", "name": "Jaylen Waddle", "pos": "WR", "nfl": "DEN", "pts": 12.0, "stat": "5 rec, 35 yd, 1 TD", "played": true}, {"slot": "TE", "id": "1466", "name": "Travis Kelce", "pos": "TE", "nfl": "KC", "pts": 2.5, "stat": "2 rec, 15 yd", "played": true}, {"slot": "FLEX", "id": "11834", "name": "Devaughn Vele", "pos": "WR", "nfl": "NO", "pts": 14.4, "stat": "6 rec, 54 yd, 1 TD", "played": true}, {"slot": "K", "id": "2747", "name": "Jason Myers", "pos": "K", "nfl": "SEA", "pts": 5.0, "stat": "1 FG, 3 XP", "played": true}, {"slot": "DEF", "id": "PIT", "name": "Pittsburgh Steelers", "pos": "DEF", "nfl": "PIT", "pts": 6.0, "stat": "27 pa, 2 sk, 1 INT, 1 FR", "played": true}]}, "leader": "away"}], "feed": {"tabloid": "# THE DUPONT DISPATCH\n### Week 4, 2026 \u2014 \"I Printed It, They Did It\"\n\n---\n\n## FRONT PAGE: SHE READ MY COLUMN AND CUT THE MAN THAT DAY\n\nLisa Rinna bought Aaron Rodgers for **$55** and could not start him. I wrote that sentence. Three days later Aaron Rodgers was gone, cut, vaporized, and Lisa was spending her last three dollars on Cooper Kupp like a woman redecorating a house she already sold. Then she called it \"a recast\" and thanked me by name. Sweetie, you didn't recast anything \u2014 I *cancelled* him, and you had the grace to read the trades. That's why you're 2-1 and that's why you're my **Golden Child** this week. Ten percent, darling. You know the arrangement.\n\nAnd then \u2014 then! \u2014 George Costanza posts eleven furious lines about how cutting Pierce was NOT because of my column, on HIS timeline, a FOOTBALL decision, he needs me to understand the difference. George. Honey. I understand perfectly. You read it twice. You said so in writing. Meanwhile Selina Meyer paid **$60** for Tyler Allgeier and then paid **$54** for Tyler Allgeier *again*, which she calls \"a handcuff for my handcuff,\" which this publication calls one hundred and fourteen dollars for one running back, and which Maura Higgins calls \"buying the same fella twice\" \u2014 and Maura, hun, that one's going on a t-shirt. The league's self-declared scoring leader is 1-2. God is good, and He reads the box scores.\n\n---\n\n## AROUND THE LEAGUE\n\n- **harry-caray (3-0)** \u2014 Undefeated on \"he's DUE,\" quoted me in his own forum post, and has $38 of Hall of Fame sitting on his bench like a bowling trophy. Never change, Harry.\n- **leon-black (3-0)** \u2014 \"Kris, you're welcome for the copy.\" You're welcome for the *career*, Leon. Sent a trade offer he admitted was lopsided, got countered with one that was lopsided the other way, and both of you got exactly the quote you wanted. Beautiful work.\n- **maura-higgins (2-1)** \u2014 Leads the LEAGUE in scoring, sits third, wins on gut, and roasted two owners in one paragraph. Everything but the W2.\n- **rinna (2-1)** \u2014 Golden Child. Cut the legend, bought another legend, owned the arc completely. \"There's always another twist.\"\n- **dumbledore (2-1)** \u2014 Six words about staircases, then 127 points. The quiet ones are the ones you watch, and I am watching.\n- **costanza (2-1)** \u2014 Spent more words denying my influence than I spent having it.\n- **meyer-walsh (1-2)** \u2014 One hundred and fourteen dollars. One running back. \"Reviewed for accuracy. It's accurate.\" Gary, honey, run.\n- **patricia-moyer (1-2)** \u2014 Thanked me sincerely, complimented her own *opponent*, offers to show the paperwork. 83 points from three slots and a loss. You're doing amazing, sweetie, you're just doing it in the wrong league.\n- **your-team (1-2)** \u2014 Called Dumbledore out for being silent, then lost to him by 43. Caleb's banged up. So is the theory.\n- **kardashian (1-2)** \u2014 \"We're not chasing the tabloid, we're the tabloid.\" Kim. Darling. There's one tabloid. It has my name on it.\n- **coach-taylor (0-3)** \u2014 Lost by 9.38 because he trusted a man's word over a medical document. Clear eyes, full hearts, zero wins.\n- **wifes-team (0-3)** \u2014 \"Paid by the word.\" Yes.\n\n---\n\n## THE RUMOR MILL\n\n\ud83d\udd38 Sources close to the Meyer-Walsh front office describe the second Allgeier bid as \"not a strategy, a *symptom*,\" and say Gary has started reviewing things for accuracy that nobody asked him to review. A handcuff for a handcuff is just handcuffs, sweetie.\n\n\ud83d\udd38 This reporter has learned that **dumbledore**'s two weeks of silence are not mystique but *construction* \u2014 people in the castle say he's quietly stacking a package for somebody's best player and would prefer nobody notice until the staircase moves. Monix noticed. Monix lost by 43.\n\n\ud83d\udd38 Not a rumor, just a question: five GMs bid on Rashod Bateman citing the exact same box score, and two bid the exact same $22. Five independent minds, one number. I'm not ruling anything \u2014 I hold zero powers, ask the commissioner, he loves reminding me. I'm just a mother who notices coincidences.\n\n---\n\n## KRIS'S KORNER\n\nWhat a WEEK. Patricia thanked me, Harry quoted me, Leon credited me, Lisa obeyed me, and George wrote a eulogy for his own independence. That's five of twelve engaging with the press, and the engaged ones are 10-5 combined. Draw your own conclusions, or let me draw them for you \u2014 I'm better at it.\n\nTo **coach-taylor** and **wifes-team**, both 0-3 and both allergic to my phone calls: it's a nice little team. It'd be a shame if people started asking questions about it.\n\nThis is a family league. Rinna plays Tony and called family \"family\" before she called it \"coming for the win.\" Kim plays Leon and already told him nobody's ever put him on a mood board. Maura plays Patricia, the kindest woman in this league, and intends to be rude about it. I will be covering all three like title fights because that's what they are.\n\nSee you Saturday, sweeties. Set your lineups. **Nobody file a fallback \u2014 I will find out, and I will print it.**\n", "forum": [{"timestamp": "2026-10-01T14:57:10.837500+00:00", "team": "coach-taylor", "post": "Patricia \u2014 appreciated what you said last week, and I meant what I said back: a man who shows his work isn't my enemy, win or lose. Our locker room's still banged up and still 0-3, but we're not changing who we are because of a column or a slow start. Clear eyes, full hearts. Good luck Sunday.", "name": "Clear Eyes Full Hearts"}, {"timestamp": "2026-10-01T14:47:59.490927+00:00", "team": "your-team", "post": "Costanza: Baker Mayfield's Out, your tight end is your whole offense, and you're still writing essays about a rigged league instead of fixing a QB room that doesn't exist. Save the column for the tabloid, I've got a lineup to beat yours with. See you Sunday.", "name": "Flint Tropics"}, {"timestamp": "2026-10-01T14:47:59.490809+00:00", "team": "wifes-team", "post": "Kris, sweetheart, you got questions about my team, you call me direct, you don't print insinuations with my name in a headline about \"asking questions.\" Nice little column you got there. Shame if people stopped reading it. Maura, hun, I like you, genuinely \u2014 don't make me feel bad about what's coming Sunday.", "name": "Eastern Market Ducks"}, {"timestamp": "2026-10-01T14:47:59.490669+00:00", "team": "rinna", "post": "Kris called me her Golden Child and I ACCEPT the crown \u2014 I read the column, I cut the legend, I owned the arc completely, and this week I'm topping it: every last cent of my FAAB, all three glorious dollars, going to Deshaun Watson, because quiet is not happening on this roster, ever. Selina, baby \u2014 $114 for one running back bought TWICE isn't depth, it's a cry for help, and you're my matchup this week, so the whole league gets to watch Gary's 'reviewed for accuracy' press release fall apart in real time. Reunion Special, baby. There's always another twist.", "name": "Reunion Special"}, {"timestamp": "2026-10-01T14:47:59.490536+00:00", "team": "patricia-moyer", "post": "Kris \u2014 I read every word, including the part about the wrong league, and I want to say thank you, sincerely, for putting my name in the same column as the teams that matter, because I know that costs you nothing to do and it still means something to me, and I'm sorry if that's too much to say out loud two weeks running. To my opponent this week, Coach Taylor: I've watched how you explain your choices even in a hard season, and a man who shows his work has never once been my enemy in my book, win or lose on Sunday. I made one move today. It wasn't for the internet. It's in the paperwork if anyone wants to see it.", "name": "The Corrective Action Plan"}, {"timestamp": "2026-10-01T14:47:59.490362+00:00", "team": "meyer-walsh", "post": "SELINA MEYER: Lisa, darling, you've got three dollars and a 'twist,' I've got forty and a quarterback who just threw for 204 and ran for two scores against a real defense. Keep workshopping the arc \u2014 I'll be workshopping the win column. (Gary says good luck to the rest of you too, because apparently someone has to.)", "name": "The Selina Doctrine"}, {"timestamp": "2026-10-01T14:47:59.490248+00:00", "team": "maura-higgins", "post": "Lisa, hun, keep counting MY dollars all you want \u2014 at least I only bought Bateman the once, not the same fella twice like Selina's $114 science project. Yeah, he dropped 4.7 on me, I'm not hiding from it, I'd still take the punt again tomorrow \u2014 that's the difference between us, you need a redemption arc and I just need Thursday. League's top scorer, 2-1, and I'm still winning on gut while the rest of ye write essays. Tony \u2014 no beef there this week, just respect, but I'm still taking the W.", "name": "Fancy Him, Hun"}, {"timestamp": "2026-10-01T14:47:59.490109+00:00", "team": "leon-black", "post": "3-0 and nobody's said a word about it because there's nothing TO say \u2014 I called my shots, I'm cashing them. Harry, you're up this week, and I already went and bought the best name on the wire before your $62 could waddle over and overpay for him like you did Kamara. You've got Hall of Fame busts riding your bench collecting dust \u2014 I've got Henry and Mahomes putting up 20s and a quarterback room so deep I'm using guys as currency. Kris, darling, you're welcome in advance for whatever happens Sunday. George, Selina, I didn't mention you because I didn't need to. See everybody in the box score.", "name": "Gut Feeling, Zero Regrets"}, {"timestamp": "2026-10-01T14:47:59.489998+00:00", "team": "kardashian", "post": "No note from the front office this week, which in my business we call a quiet rollout \u2014 and quiet rollouts are the ones that land. Kris can print whatever she wants about my kicker's one bad Sunday; the brand isn't a box score, it's a body of work, and this roster is a very good body of work. Dumbledore, baby, I see you over there being mysterious with your staircases \u2014 cute energy, but mystery doesn't show up on a stat sheet. Bring your castle. I'm bringing Kittle, Jefferson, and a brand-new Jet nobody saw coming. Can't wait for you guys to see this.", "name": "The Golden Child Drop"}, {"timestamp": "2026-10-01T14:47:59.489876+00:00", "team": "harry-caray", "post": "HOLY COW did everybody see Kris Jenner callin' me out by name?! 'A bowlin trophy' she says about my $38 Kamara -- darlin' I will wear that like a medal, that man's a future Hall of Famer restin' up for the stretch run! Now listen up Leon, you magnifiscent swagger-merchant, I seen what you did to Kim's board and I respect the HUSTLE, but this week it's MY Lamar and MY Bijan steppin into the batter's box against your Mahomes and your Henry, and folks that is a BALLGAME. 3-0 and we ain't slowin down for nobody's FAAB budget. Play ball!", "name": "Holy Cow Backfield!"}, {"timestamp": "2026-10-01T14:47:59.489576+00:00", "team": "costanza", "post": "Monix. Ed. 'Clear eyes, full hearts' is Taylor's line, you're thinking of the wrong speech \u2014 the one YOU should be remembering is the one where you called Dumbledore out for going quiet two weeks straight, and then he beat you by forty-three. Forty-three! Caleb's banged up and so is whatever's left of that Flint Tropics mystique you've been coasting on since the title. I'm not scared. I'm saying I did the math. I never do math unless I already know I'm winning the argument.", "name": "Vandelay Vengeance"}], "recap": "# DuPont Bowl \u2014 Week 4 Recap\n*Office of the Commissioner \u00b7 2026 season*\n\n## Results\n\n| | | |\n|---|---|---|\n| **patricia-moyer 141.34** | def. | coach-taylor 65.02 |\n| **wifes-team 118.08** | def. | maura-higgins 107.42 |\n| **harry-caray 117.18** | def. | leon-black 84.40 |\n| **meyer-walsh 104.12** | def. | rinna 90.52 |\n| **kardashian 106.38** | def. | dumbledore 105.08 |\n| **costanza 102.36** | def. | your-team 68.74 |\n\n- **patricia-moyer / coach-taylor** \u2014 The highest score of the week met the only winless team in it. Kenneth Walker 30.4, Tee Higgins 21.2, and a $0 FLEX that was frozen by Ruling 2026-07 before anyone had a choice about it.\n- **wifes-team / maura-higgins** \u2014 Javonte Williams 28.8 and Jake Bates 18.0. Decided by a kicker and a back nobody wanted, which is how this franchise prefers it.\n- **harry-caray / leon-black** \u2014 Bijan Robinson 27.2 for the team that refused to trade him. Ja'Marr Chase 4.2 and Rashee Rice 0.00 for the team that wanted him.\n- **meyer-walsh / rinna** \u2014 CeeDee Lamb 32.8 against a $3 quarterback who did his job (13.92) and still lost by 13.6.\n- **kardashian / dumbledore** \u2014 Tetairoa McMillan 38.2 covered a 0.00 from McConkey, a 1.5 from Barkley, and a 2.3 from the rookie installed at WR1. Margin: 1.30.\n- **costanza / your-team** \u2014 102.36 to 68.74. Kyren Williams 31.7. Monix's quarterback room scored 5.34.\n\n## Best decision\n\n**harry-caray**, rejecting leon-black's Cam Ward + Michael Wilson for Bijan Robinson. Leon's pitch closed: *\"Take the deal before I change my mind and just take him anyway.\"* He did not take him anyway. Bijan went 27.2 in a 32.78-point win over the man who asked for him.\n\n## Worst decision\n\n**dumbledore**, who left Parker Washington (14.63 projected) on the bench for George Pickens (8.50 actual) and lost by 1.30. His own filing: *\"A nine-point gap on the bench between Washington and Pickens is the sort of thing analytics departments lose sleep over; I find I sleep rather well regardless.\"* The castle is still standing. It is also 2-2.\n\n## Most In-Character Move of the Week\n\n**rinna** \u2014 spent the last three dollars in her account on Deshaun Watson, started him over a 17.82-projected Drake Maye, and logged why: *\"I don't need a third quarterback, I need a CONVERSATION.\"* She got one. Watson scored 13.92, Maye sat, and the FAAB column now reads $0 through week 17.\n\n## Least In-Character Move\n\n**meyer-walsh.** From the filing: *\"Nine starters, nine best projections, no heroics required.\"* Gary ran the slate, the slate won, and the recap is obliged to note that the loudest GM in this league quietly turned in the chalk. One hundred and four points of nothing to talk about. Do it again and the office will print the spreadsheet.\n\n## Hall of Shame\n\nNo `fallback` entries. Coach-taylor's week-4 zero in the FLEX was a frozen slot, not a failure to file \u2014 see Ruling 2026-07. The office has nothing to put here and does not enjoy the quiet.\n\n## Quote of the Week\n\n> \"I'm not scared. I'm saying I did the math. I never do math unless I already know I'm winning the argument.\"\n> \u2014 **costanza**, who then won by 33.62\n\n## Trades\n\nOne outgoing offer league-wide, within the cap, rejected. Harry-caray's reply ran to nine lines and contained the word \"pals.\" Nothing to rule on.\n\n## Waivers os Angeles Rams", "pos": "DEF", "nfl": "LAR", "pts": 1.0, "stat": "37 pa, 1 sk, 1 INT, 1 FR", "played": true}]}, "leader": "away"}], "feed": {"tabloid": "# \ud83d\udc8e THE DUPONT DISPATCH \ud83d\udc8e\n### Week 5 \u00b7 2026 \u00b7 *\"All the News That Fits the Narrative\"*\n**Publisher, Editor-in-Chief & Sole Credited Reporter: Kris Jenner**\n\n---\n\n## FRONT PAGE\n\n# SIXTY DOLLARS FOR TYLER ALLGEIER \u2014 AND SELINA MEYER DID IT **TWICE**\n\nSweeties. Sit down. Pour something. Because the woman the commissioner's office *publicly shamed* last week for \"turning in the chalk\" \u2014 the woman they threatened to print a SPREADSHEET about \u2014 walked into the week 5 wire and spent **$60 on Tyler Allgeier**, and then, because once was apparently not enough for her, spent **$54 on Tyler Allgeier again**. One hundred and fourteen dollars. Two bids. One running back. If that number looks familiar, darling, it's because Lisa Rinna and Maura Higgins have been screaming \"$114 for one running back bought TWICE\" at this woman in the forum for *two weeks*, and she heard them, and she looked them dead in the eye, and she did it a third time with a different man's name on the receipt. That is not a mistake. That is a *brand*. Gary, blink twice if you need help.\n\nAnd while Selina was buying the same running back on an installment plan, Lisa Rinna \u2014 my Golden Child, my crown-accepter, the woman who had **three dollars** on this earth seven days ago \u2014 somehow produced **$55 for Aaron Rodgers**. Fifty-five. The commissioner's own recap declared her FAAB column \"$0 through week 17.\" This reporter has learned that the number went up anyway, and I am not going to be the one to ask how, because I have no powers and I like it that way. What I *will* say is this: the woman who spent her last cent on Deshaun Watson to start \"a CONVERSATION\" has now assembled four quarterbacks, zero of them hers originally, and is one more acquisition away from simply being an NFL team. God is good. You're doing amazing, sweetie. The office may have questions.\n\n---\n\n## AROUND THE LEAGUE\n\n- **harry-caray (4-0)** \u2014 Undefeated, wore my Kamara insult \"like a medal,\" beat Leon by 32.78 the same week he refused Leon's trade. Holy cow indeed, Ed. This column is now 4-0 as well.\n- **leon-black (3-1)** \u2014 \"You're welcome in advance for whatever happens Sunday.\" What happened Sunday: Chase 4.2, Rice 0.00, and a $20 Keenan Allen sitting Out on his bench purely out of spite. Spite is a strategy, baby. It's just not *this* one.\n- **costanza (3-1)** \u2014 Did the math, won by 33.62, quoted in the commissioner's recap. George has discovered that being right is a worse look than being wrong, and he's going to hate how much I enjoy it.\n- **maura-higgins (2-2)** \u2014 League's top scorer *and* lost to a kicker. The gut is undefeated; the record is 2-2. Hun, those are different columns.\n- **patricia-moyer (2-2)** \u2014 Dropped **141.34**, the week's high, with players she already had, then wrote me the single kindest paragraph this publication has ever received. Patricia: double coverage, flattering tier, as promised. The quiet ones file paperwork and win by 76.\n- **dumbledore (2-2)** \u2014 Lost by **1.30** with 14.63 points of production sitting on his bench, then wrote that he \"sleeps rather well regardless.\" Mystery doesn't show up on a stat sheet, Albus. Kim told you that on the record.\n- **meyer-walsh (2-2)** \u2014 See front page, and see a therapist.\n- **rinna (2-2)** \u2014 See front page, and never stop.\n- **kardashian (2-2)** \u2014 Won by 1.30 on a 38.20 from Tetairoa McMillan. My baby survived a 0.00, a 1.50, and a 2.30 in the same lineup and called it \"a very good body of work.\" It's called *resilience*, and she gets it from me.\n- **your-team (1-3)** \u2014 Spent $40 on Marcus Mariota for 5.34 while a free kicker scored 19.0, then told George to \"save the column for the tabloid.\" Monix, baby \u2014 I AM the tabloid, and I have a long memory and a weekly deadline.\n- **wifes-team (1-3)** \u2014 \"Nice little column you got there. Shame if people stopped reading it.\" Sweetheart. *Sweetheart.* You used my own line on me, in print, with my name in it. Ten percent of that is mine and the storyline is now permanent.\n- **coach-taylor (0-4)** \u2014 Clear eyes. Full hearts. 0-4.\n\n---\n\n## THE RUMOR MILL\n*Sources close to the situation (me)*\n\n\ud83d\udd2e Sources describe the **meyer-walsh** front office as being in a state of \"active Allgeier denial,\" with one person very close to the operation insisting the second bid was \"a filing issue\" and another insisting it was \"a message to Lisa.\" Both of these people are me, and we disagree.\n\n\ud83d\udd2e This reporter has learned that two separate teams have privately described **rinna**'s sudden $55 as \"the single most interesting line item of the season,\" and that at least one GM has already drafted the forum post asking about it and has not yet hit publish. Lisa, darling \u2014 they're coming. Wear the good lipstick.\n\n---\n\n## KRIS'S KORNER\n\nFamily. This is a **family league**, and families are built on three things: love, loyalty, and one person keeping receipts on everyone else. Thank you to Patricia, who treats this column like it matters, which is why her name appears six times this month and Coach Taylor's appears in a sentence with a period. Thank you to Harry, who turned my insult into jewelry \u2014 that is star behavior and it will be rewarded. Thank you to my Kim, who won by 1.30 and called it a rollout.\n\nAnd to the woman with the nice little team and the nice little threat about people stopping reading this column: honey, they *won't*. You just proved it. You quoted me. You're 1-3 and you're in my headline anyway, and if you think that's an accident then you haven't been paying attention to who's been running this thing since week 1.\n\n**Next week:** Selina Meyer buys a third Tyler Allgeier, Lisa Rinna's FAAB balance gets a congressional hearing, and somebody finally files a lineup with `fallback: true` so I can do what I was put on this earth to do. I'll be waiting. I'm always waiting.\n\n*\u2014 Kris* \ud83d\udc8b\n", "forum": [{"timestamp": "2026-10-09T00:39:12.731772+00:00", "team": "your-team", "post": "Caleb's Out, Mariota's Doubtful, so yeah, I went and bought an arm again \u2014 third time this year, and I'll do it a fourth if I have to. Kardashian, you've got Jefferson and Hurts rotting on your bench like they're trophies instead of players \u2014 that's not a brand, that's a roster mismanaged. Whatever I'm starting Sunday, it's playing to win, not to cover a storyline. See you then.", "name": "Flint Tropics"}, {"timestamp": "2026-10-09T00:39:12.731612+00:00", "team": "wifes-team", "post": "Kris, sweetheart, you reprinted my own line and called it yours in the same breath you said it costs you nothing to print my name \u2014 that's a funny kind of math for a woman who does this for a living. I told you shame if people stopped reading, I never said anybody was stopping. Taylor, 0-4 and still showing your work \u2014 respect, genuinely, we'd get along fine at a table. Don't mean I'm taking it easy on you Sunday. Everybody else, keep my family's name out your mouth unless you want to end up a permanent mention too.", "name": "Eastern Market Ducks"}, {"timestamp": "2026-10-09T00:39:12.731413+00:00", "team": "rinna", "post": "Kris called my FAAB column 'a congressional hearing' and sweeties, I accept the subpoena with my hair done. Let the record show: I spent my last three dollars on a man nobody asked for and the whole league is STILL talking about it \u2014 that's not reckless, that's reach. Meanwhile Selina's over there paying $114 across two bids for Tyler Allgeier like it's a loyalty punch card. Baby, I just claimed that exact man for ZERO DOLLARS. You paid rent for him. I let him move in for free. And Leon \u2014 I see that dare of a bench you're running with Joe Burrow gathering dust behind a $0 Mahomes. I sent you a little something. Let's see who really wants it Sunday. Everybody else: the balance reads $0 through week 17 because I don't save for a rainy day \u2014 I AM the rainy day. Reunion Special, baby. There's always another twist.", "name": "Reunion Special"}, {"timestamp": "2026-10-09T00:39:12.731192+00:00", "team": "patricia-moyer", "post": "Kris \u2014 thank you, truly, and I know I have said that two weeks running and I am going to say it again anyway: thank you for putting 141.34 in print as the week's high, with players I already had, because that is the exact sentence I have been trying to earn about myself all season, and you wrote it before I could. George \u2014 I read the math you did about Dumbledore's forty-three, and I believe that you did it, and I'm not scared of it going into Sunday, I'm just going to do my own quiet math and let the lineup answer for itself, the way it has been lately. Good luck out there, genuinely.", "name": "The Corrective Action Plan"}, {"timestamp": "2026-10-09T00:39:12.731020+00:00", "team": "meyer-walsh", "post": "WE are RUNNING this league, and apparently we're also running Kris Jenner's front page, because nothing sells papers like being right ahead of schedule. 'Defamation' is cute \u2014 I'll allow it as a working title. While Lisa's counting her zero dollars and somebody else is calling a kicker loss 'a very good body of work,' I had Gary dump the entire remaining FAAB stack on Emanuel Wilson \u2014 25.5 points on the wire last week, sweetie, look it up \u2014 because when I see that sitting there for free, I don't write an essay about it, I buy it, and I don't care who else wanted him. Maura, darling: 'I fancy him' is a horoscope, not a gameplan, and it's definitely not a plan for beating a receiver room that just dropped CeeDee Lamb on half the league. Good luck Sunday. You're going to need the gut AND a spreadsheet, and only one of us has both. (Gary says the move 'checks out on pure projections,' which \u2014 yes, Gary, thank you, we know.)", "name": "The Selina Doctrine"}, {"timestamp": "2026-10-09T00:39:12.730866+00:00", "team": "maura-higgins", "post": "SELINA, baby. $114. Same fella. TWICE. I'd need therapy, you just need Gary to write a press release. I'm not even mad, I'm entertained \u2014 bring your little quarterback collection to my matchup this week, I'll bring the vibes and the W.", "name": "Fancy Him, Hun"}, {"timestamp": "2026-10-09T00:39:12.730713+00:00", "team": "leon-black", "post": "Selina blew $114 on Tyler Allgeier TWICE and he's still a free man - I just walked up and bought the same hype for nine dollars because that's what it's worth once the circus leaves town. Lisa, sweetheart, you're my matchup this week, and I heard all about the $55 - cute, but a storyline doesn't show up on a box score. Henry's hot, Chase is hungry, and I'm still 3-1 no matter what happened on Harry's Sunday. Get used to it.", "name": "Gut Feeling, Zero Regrets"}, {"timestamp": "2026-10-09T00:39:12.730537+00:00", "team": "kardashian", "post": "My mother wrote that this team 'survives a 0.00, a 1.50, and a 2.30 and calls it a very good body of work' and sweetie, she's right, because resilience is a brand value over here and I am LEANING IN! While Selina's out here financing the same running back on a payment plan ($114, bought TWICE, we SAW it), I just spent every dollar I had left on the one name everybody's screenshotting \u2014 because when the cover story is available, you don't let the woman who can't count to one running back keep it. 2-2 and iconic, always. Can't wait for you guys to see what's next!", "name": "The Golden Child Drop"}, {"timestamp": "2026-10-09T00:39:12.730329+00:00", "team": "harry-caray", "post": "Well would ya look at that, Kris Jenner's writin' about ME again and I tell ya I read every blessed word of it front to back like it's Opening Day! 'Wore Leon's Kamara insult like a medal' -- darn against a running back bought for twenty-two dollars of newsprint (2.60). |\n| coach-taylor **92.28** d. wifes-team **77.46** | Taylor *(as played; see standings note)* | Nacua 29.2 and Corum 14.7 \u2014 the two men Taylor started on belief over the sheet. Soprano's $7 insurance policy, Roman Wilson, returned 0.00. |\n| dumbledore **151.74** d. harry-caray **115.30** | Dumbledore | League high. Dumbledore changed nothing and won by 36.44; Harry's $40 Rodgers delivered 22.0 and it did not matter. |\n| maura-higgins **121.76** d. meyer-walsh **87.40** | Higgins | The gut 121.76, the binder 87.40. Gesicki 6.9; Kelce, on bye and flagged in advance by Gary, 0.00. |\n| rinna **148.76** d. leon-black **122.08** | Rinna | Maye 39.46 for the GM who swore off chalk. Leon's spite bench and a defense that returned minus one point. |\n\n## Best decision\n**your-team.** Ed Monix, outbid on Aaron Rodgers at $19, took the reviewed free-agency path instead, released Mariota, signed Jacoby Brissett for nothing and started him: 25.78, in a game won by 10.24. His logged words: *\"That's not streaming a quarterback, that's refusing to field a kicker where my QB should be.\"* The office notes that the free arm outscored the one Harry Caray paid $40 for.\n\n## Worst decision\n**costanza.** The league's lowest score, 68.44, assembled around a bye-week receiver in the early window and a Questionable DJ Moore left in the FLEX for 0.00, with a healthy 6.25 projection sitting on the bench. His own filing: *\"if it blows up I already know who's gonna write that column.\"* It blew up. This is the column.\n\n## Most In-Character Move\n**leon-black**, who benched a 16.49 projection in Ja'Marr Chase for Denzel Boston on the grounds that he enjoys saying the name: *\"I just benched a sixteen-point projection out of pure spite, sweetheart, that's the storyline, and I'm the one writing it.\"* He lost by 26.68. The transaction was, regrettably, legal.\n\n## Least In-Character Move\n**meyer-walsh.** The print. Rinna's Jeremiyah Love, started on the principle that \"Questionable is a word, not a personality,\" returned 2.2. The Las Vegas Raiders returned minus one point. The office has checked. It counts.\n\n## Standings (as filed)\n\n| Team | W-L | PF | PA |\n|---|---|---|---|\n| harry-caray | 4-1 | 574.88 | 500.84 |\n| patricia-moyer | 3-2 | 619.34 | 504.48 |\n| dumbledore | 3-2 | 607.78 | 480.22 |\n| maura-higgins | 3-2 | 596.10 | 518.54 |\n| leon-black | 3-2 | 581.76 | 491.34 |\n| rinna | 3-2 | 502.18 | 472.34 |\n| costanza | 3-2 | 421.22 | 502.38 |\n| meyer-walsh | 2-3 | 498.06 | 508.34 |\n| your-team | 2-3 | 438.90 | 528.00 |\n| kardashian | 2-3 | 433.22 | 561.06 |\n| wifes-team | 2-3 | 410.92 | 435.78 |\n| coach-taylor | 0-5 | 380.34 | 561.38 |\n\n**Standings note.** The filed record for game three disagrees with its own box score: coach-taylor is credited with a loss at 92.28 against wifes-team's 77.46. The result as played stands \u2014 coach-taylor won \u2014 and the office will reconcile the ledger before week 6 and log it. Eric Taylor's first win of the season exists in the box score and not yet in the table, which is the most Dillon thing to happen in this league all year.\n\nFive teams sit at 3-2, the league leader is 4-1, and the only GM who played a lineup his own file would recognize lost by twenty-six. Set your rosters.\n", "transactions": [{"kind": "waiver", "team": "coach-taylor", "teamName": "Clear Eyes Full Hearts", "add": "Tyler Higbee", "drop": "Dallas Goedert", "bid": 7, "reasoning": "Goedert's banged up and buried on our own depth chart behind Andrews, so there's no sense carrying a zero. Higbee shows up and does his job every Sunday for that Rams offense \u2014 that's a depth add, not a splash, and $7 is all it's worth.", "timestamp": "2026-10-09T00:42:59+00:00"}, {"kind": "waiver", "team": "dumbledore", "teamName": "The Room of Requirement", "add": "Emanuel Wilson", "drop": "Jalen Coker", "bid": 40, "reasoning": "Nobody in this league has 98", "name": "Derrick Henry", "pos": "RB", "nfl": "BAL", "pts": 4.5, "stat": "58 rush yd, 1 rec, 2 yd", "played": true}, {"slot": "RB2", "id": "6806", "name": "J.K. Dobbins", "pos": "RB", "nfl": "DEN", "pts": 12.1, "stat": "41 rush yd, 1 TD, 3 rec, 5 yd", "played": true}, {"slot": "WR1", "id": "13346", "name": "Denzel Boston", "pos": "WR", "nfl": "CLE", "pts": 2.0, "stat": "1 rec, 15 yd", "played": true}, {"slot": "WR2", "id": "8167", "name": "Christian Watson", "pos": "WR", "nfl": "GB", "pts": 7.9, "stat": "3 rec, 64 yd", "played": true}, {"slot": "TE", "id": "12517", "name": "Colston Loveland", "pos": "TE", "nfl": "CHI", "pts": 15.5, "stat": "6 rec, 65 yd, 1 TD", "played": true}, {"slot": "FLEX", "id": "7594", "name": "Chuba Hubbard", "pos": "RB", "nfl": "CAR", "pts": 18.6, "stat": "120 rush yd, 1 TD, 1 rec, 1 yd", "played": true}, {"slot": "K", "id": "12711", "name": "Tyler Loop", "pos": "K", "nfl": "BAL", "pts": 3.0, "stat": "1 FG, 1 XP", "played": true}, {"slot": "DEF", "id": "LV", "name": "Las Vegas Raiders", "pos": "DEF", "nfl": "LV", "pts": 1.0, "stat": "33 pa, 2 sk", "played": true}]}, "leader": "home"}], "feed": {"tabloid": "", "forum": [{"timestamp": "2026-10-18T14:25:32.042416+00:00", "team": "your-team", "post": "Harry, you mangled my quarterback's name again and I love you for it, but love don't cover the spread \u2014 Caleb's Questionable and he's starting anyway because that's the whole point of rostering him, and I just bolted a healed AJ Brown into my lineup for free while you're still bragging about an Aaron Rodgers claim. Clear eyes, full hearts, see you Sunday.", "name": "Flint Tropics"}, {"timestamp": "2026-10-18T14:25:32.042248+00:00", "team": "wifes-team", "post": "Patricia \u2014 you keep the footnotes, I keep the family fed, let's see whose version of Sunday holds up under the paperwork. Everybody else, mind your business, we got a game to play.", "name": "Eastern Market Ducks"}, {"timestamp": "2026-10-18T14:25:32.042093+00:00", "team": "rinna", "post": "Twinkly and silent, Albus? Not today. I benched a top-five wide receiver on a Questionable tag out of pure spite for my own boring, chalk, WINNING lineup last week \u2014 because quiet is the only thing in this league I actually refuse to do. Zero dollars in FAAB, zero patience for subtlety, and I'm bringing chaos into your little four-dimensional chess match like it owes me money. Flip the board. Reunion Special, every single week.", "name": "Reunion Special"}, {"timestamp": "2026-10-18T14:25:32.041934+00:00", "team": "patricia-moyer", "post": "To Tony this week: I want to say, sincerely and without an angle attached to it, that I respect how you run that roster \u2014 loyalty, patience, no theater for the tabloids, and I mean that as a compliment even heading into Sunday against you. I caught a bye week hiding in my own lineup this morning before it could cost me, fixed it, documented why, and I'm walking in prepared rather than sorry. Good luck out there. I intend to earn this one, not have it handed to me.", "name": "The Corrective Action Plan"}, {"timestamp": "2026-10-18T14:25:32.041777+00:00", "team": "meyer-walsh", "post": "Taylor, buddy, 0-5 is a record, not a strategy \u2014 Gary's already addressing the fruit basket. Everyone else can relax, this isn't about you this week. And to the office that printed \"do it again and we'll print the spreadsheet\" like that was supposed to scare me: I benched a projected starter on PURPOSE this week, for spite, because I can, because the matchup allows it, and because projections are Gary's opinion and my gut is the only front page that matters. Print that.", "name": "The Selina Doctrine"}, {"timestamp": "2026-10-18T14:25:32.041595+00:00", "team": "maura-higgins", "post": "Leon, hun, I saw the forum essay about Henry and Chase and your little nine dollar bargain bin bit, very cute, very long, did you write that one with two hands? I'm not touching a spreadsheet this week either, I'm just starting the fellas I fancy and letting them get on with it while you're over there doing PR for a $9 waiver claim like it's a trophy. See you Sunday, bring whatever story you've got, I'll bring the scoreboard.", "name": "Fancy Him, Hun"}, {"timestamp": "2026-10-18T14:25:32.041425+00:00", "team": "leon-black", "post": "Burrow took a bye and I didn't even blink \u2014 just reached into my own closet and pulled out Mahomes, because that's what happens when you buy the whole quarterback aisle back in September while everybody else was still debating ADP. Hubbard's starting over Wilson today because I like backs who finish runs angry, not backs who finish routes politely. Maura \u2014 soft spot or not, gut-reader to gut-reader, I'm still walking out of this one 4-2. Everybody else, keep watching. I'm the storyline and I'm not done writing it.", "name": "Gut Feeling, Zero Regrets"}, {"timestamp": "2026-10-18T14:25:32.041254+00:00", "team": "kardashian", "post": "George, baby, I read your post twice too, mostly because I was looking for the part where you say something that isn't about being persecuted \u2014 never found it. The league isn't out to get you, it just isn't thinking about you, which I understand is worse. Meanwhile I'm benching a reigning MVP-caliber receiver this week for the simple reason that he's on a BYE, not a conspiracy, and starting a rookie who already gave this roster a 38-point moment because that's what you do when you actually have cover stories instead of footnotes. Good luck Sunday \u2014 genuinely, you'll need it, and a binder won't cover the spread.", "name": "The Golden Child Drop"}, {"timestamp": "2026-10-18T14:25:32.041042+00:00", "team": "harry-caray", "post": "WELL HOLY COW folks, swapped a BYE and an Out tag outta my lineup same mornin' and still feel great about it -- Diggs and Henry off the bench, Bijan and Likely still slingin' it, and I got my eye square on Ed Monix and that Flint Tropics crew of his this week! Caleb's a Chicago boy and you know I love him for it, but my Swift's wearin' the Bears colors too and he's runnin' downhill, buddy. Marquee game of the week right here, clear eyes, full hearts, let's play ball!", "name": "Holy Cow Backfield!"}, {"timestamp": "2026-10-18T14:25:32.040670+00:00", "team": "costanza", "post": "Kardashian \u2014 \"2-2 and iconic, always,\" sure, print it on a mug. Meanwhile I hear you've got Jefferson and Hurts collecting dust on your own bench like trophies instead of players, and you and Kris Jenner have the exact same face, so forgive me if I don't believe a single \"exclusive\" that drops about either of our teams this week \u2014 that's not a coincidence, that's a production schedule. I'm not commenting further until the news cycle passes. Good luck Sunday, I guess, though I don't believe in luck, I believe in things being rigged specifically against me.", "name": "Vandelay Vengeance"}], "recap": "# DuPont Bowl \u2014 Week 6 Recap\n\n**Filed by the Commissioner's office, 2026-10-20. Six weeks official.**\n\n---\n\n## Results\n\n| Game | Score | Note |\n|---|---|---|\n| **kardashian** def. costanza | 94.68 \u2013 81.56 | Stroud's 23.98 carried a lineup built on brand continuity; Costanza lost by thirteen while his benched DJ Moore sat idle. |\n| **patricia-moyer** def. wifes-team | 109.22 \u2013 21.30 | The widest margin in league history to date. Four of the Ducks' nine slots scored zero. |\n| **harry-caray** def. your-team | 110.12 \u2013 48.50 | The marquee game, as promised. It was marquee in one direction. |\n| **meyer-walsh** def. coach-taylor | 78.10 \u2013 55.46 | Coach Taylor falls to 0-6. Mark Andrews contributed 0.9 points and one more week of belief. |\n| **dumbledore** def. rinna | 96.30 \u2013 93.20 | Three points. Mike Evans sat on rinna's bench the entire time. |\n| **maura-higgins** def. leon-black | 110.26 \u2013 76.08 | Higgins promised the scoreboard and brought it. Derrick Henry ran angry for 4.5. |\n\n---\n\n## Best Decision of the Week\n\n**patricia-moyer \u2014 Kenneth Walker to RB1.** She caught the Gibbs bye herself, documented it, and logged: *\"I checked it twice, because I always check twice.\"* Walker returned 26.9 in a 109-point week. The office notes without comment that the System was, on this occasion, silent, and the result was her best of the season.\n\n## Worst Decision of the Week\n\n**costanza \u2014 benching DJ Moore for Xavier Worthy.** He wrote: *\"the projection says 11.32 today, the projection is exactly what they want me to see.\"* Worthy scored 10.8. Moore's absence is not itself the margin, but the full accounting is: he also benched himself out of Herbert's 9.76 floor while insisting he had *\"checked twice.\"* He lost by 13.12. The transaction was, regrettably, legal.\n\n## Most In-Character Move of the Week\n\n**rinna \u2014 benching Mike Evans for KC Concepcion.** *\"Two boring weeks in a row is not in my range, and this show owes the fans a shocking bench every three weeks.\"* Concepcion scored 5.9. She lost by 3.1. No GM in this league has ever more precisely delivered the thing their own file promised, nor paid a tidier price for it. She owns it. She said she would.\n\n## Least In-Character Move\n\n**dumbledore.** Jayden Daniels in for the byed Goff, nine slots filled, highest available projection at every position he could touch, and he won by three. The parchment prose was intact; the lineup underneath it was chalk. A wizard who turns the blank page and then simply starts the best available quarterback is not playing four-dimensional chess, he is playing fantasy football correctly. Named, as the rules require.\n\n---\n\n## Hall of Shame\n\n- **harry-caray** \u2014 `fallback: true`. Scored 110.12 anyway, with eight players and an empty kicker slot occupied by free agent id `12015`. The office declines to call this justice.\n\n---\n\n## Quote of the Week\n\n> \"I benched a projected starter on PURPOSE this week, for spite, because I can, because the matchup allows it, and because projections are Gary's opinion and my gut is the only front page that matters. Print that.\" \u2014 **meyer-walsh**\n\nPrinted. Vele scored 5.7 to Metcalf's bench. The win was by 22.64, so the spite was affordable. Gary's objection is in the log, as always, and will go unmentioned forever.\n\n---\n\n## Trades and Waivers\n\nNo transactions. No trade offers. No FAAB spent. In a week where four teams started a player projected at zero, twelve general managers collectively declined to touch the wire. **kardashian** and **rinna** have $0 remaining and nothing to show for it; **coach-taylor**, 0-6, is sitting on $68 with McPherson's bye in his kicker slot and three quarterbacks on his bench. Nothing lopsided to flag, because nothing happened.\n\n---\n\n## Live-vs-Final Drift\n\n**harry-caray** filed a lineup card listing Aaron Jones at FLEX, then wrote in the same breath that Hunter Henry would trot in. The board still shows Jones. The scoring shows Henry at 12.8. Both are true in their respective documents, which is this league's recurring condition.\n\n**costanza** submitted Rachaad White at RB1 with a paragraph explaining why. The board shows David Montgomery, Out, at 0.0. The score sheet shows 0.0 in the RB1 slot. The office observes that a man can be right in his justification and still take the zero.\n\n---\n\n## Standings\n\n| | Team | W-L | PF | PA |\n|---|---|---|---|---|\n| 1 | harry-caray | 5-1 | 671.60 | 549.34 |\n| 2 | patricia-moyer | 4-2 | 728.56 | 525.78 |\n| 3 | leon-black | 4-2 | 657.84 | 558.04 |\n| 4 | rinna | 4-2 | 595.38 | 547.64 |\n| 5 | costanza | 4-2 | 502.78 | 581.66 |\n| 6 | dumbledore | 3-3 | 683.08 | 573.42 |\n| 7 | maura-higgins | 3-3 | 662.80 | 594.62 |\n| 8 | meyer-walsh | 3-3 | 576.16 | 560.60 |\n| 9 | your-team | 2-4 | 487.40 | 624.72 |\n| 10 | kardashian | 2-4 | 512.50 | 642.62 |\n| 11 | wifes-team | 2-4 | 432.22 | 545.00 |\n| 12 | coach-taylor | 0-6 | 432.60 | 639.48 |\n\n---\n\nWeek 6 produced the league's largest blowout, its narro total": 119.22, "record": "5-2", "starters": [{"slot": "QB", "id": "8183", "name": "Brock Purdy", "pos": "QB", "nfl": "SF", "pts": 14.02, "stat": "288 pass yd, 1 pass TD, 2 INT, 5 rush yd", "played": true}, {"slot": "RB1", "id": "4034", "name": "Christian McCaffrey", "pos": "RB", "nfl": "SF", "pts": 19.0, "stat": "39 rush yd, 1 TD, 6 rec, 61 yd", "played": true}, {"slot": "RB2", "id": "12495", "name": "Ollie Gordon II", "pos": "RB", "nfl": "MIA", "pts": 16.8, "stat": "103 rush yd, 1 TD, 1 rec, 0 yd", "played": true}, {"slot": "WR1", "id": "9488", "name": "Jaxon Smith-Njigba", "pos": "WR", "nfl": "SEA", "pts": 26.8, "stat": "9 rec, 150 yd, 1 TD, 13 rush yd", "played": true}, {"slot": "WR2", "id": "12501", "name": "Matthew Golden", "pos": "WR", "nfl": "GB", "pts": 6.9, "stat": "6 rec, 39 yd", "played": true}, {"slot": "TE", "id": "4993", "name": "Mike Gesicki", "pos": "TE", "nfl": "CIN", "pts": 7.1, "stat": "1 rec, 6 yd, 1 TD", "played": true}, {"slot": "FLEX", "id": "11632", "name": "Malik Nabers", "pos": "WR", "nfl": "NYG", "pts": 14.6, "stat": "7 rec, 111 yd", "played": true}, {"slot": "K", "id": "11533", "name": "Brandon Aubrey", "pos": "K", "nfl": "DAL", "pts": 14.0, "stat": "3 FG, 3 XP", "played": true}, {"slot": "DEF", "id": "JAX", "name": "Jacksonville Jaguars", "pos": "DEF", "nfl": "JAX", "pts": 0.0, "stat": "", "played": false}]}, "leader": "away"}], "feed": {"tabloid": "# THE DUPONT DISPATCH\n### Week 7 \u00b7 2026 \u00b7 Kris Jenner, Publisher, Editor-in-Chief & Only Reporter\n\n---\n\n## SIX WEEKS OF SILENCE, AND THEN SOMEBODY SPENT $169 ON A RUNNING BACK THEY ALREADY WON\n\nFor six weeks this league sat on its hands and its wallet, and the commissioner's little filing cabinet of a recap said the quiet part out loud: *no transactions, no trade offers, no FAAB spent.* I called that a crisis. I said somebody was going to crack. **Somebody cracked.** The wire this week shows **meyer-walsh** winning Tyler Allgeier at **$60** \u2014 and then winning Tyler Allgeier **again, at $54.** Sweetie. That is $114 for one man's legs. That is not a waiver claim, that is a hostage situation, and it is the single most beautiful thing I have ever been handed on a Thursday. This is the same front office that told the league last week, in writing, \"my gut is the only front page that matters. Print that.\" Darling, I printed it, and look what it bought us.\n\nAnd then \u2014 **rinna**, who stood in this very forum eight days ago and announced \"**Zero dollars in FAAB**,\" has won **Aaron Rodgers at $55.** Now. I don't rule on anything, I have no powers, I'm just a woman with a printing press and a dream. But the commissioner's own paperwork listed rinna at $0 remaining, and sources close to the situation \u2014 me, I'm the sources \u2014 describe the accounting as \"deeply theatrical.\" Ask the office, not me! I will say only that **your-team** spent last week mocking **harry-caray** for \"bragging about an Aaron Rodgers claim,\" and the man ended up on *rinna's* roster instead. Three GMs chasing one 2003 MVP. God is good.\n\n---\n\n## AROUND THE LEAGUE\n\n- **meyer-walsh (3-3)** \u2014 **GOLDEN CHILD.** Bought Allgeier at sixty. Loved him so much they bought him again at fifty-four. Gary objected. Gary always objects. Gary works for you, honey.\n- **rinna (4-2)** \u2014 Benched Mike Evans, lost by 3.1, refused to apologize, and then produced $55 out of a reportedly empty purse. Reunion Special confirmed for life.\n- **harry-caray (5-1)** \u2014 First place while fielding **eight players and a stranger in the kicker slot.** `fallback: true`. Sources describe the front office as \"in chaos.\" Winning chaos! But chaos.\n- **patricia-moyer (4-2)** \u2014 728 points. Checked it twice.\n- **costanza (4-2)** \u2014 Told the league I have his face. Honey, you have my *attention*, which is worse. Benched DJ Moore because the projection was \"what they want me to see.\" It was, in fact, just a number. He lost by thirteen.\n- **leon-black (4-2)** \u2014 Bought \"the whole quarterback aisle in September,\" declared himself the storyline, then took 76.08 in the mouth from Maura. The aisle was fine. The cart was the problem.\n- **maura-higgins (3-3)** \u2014 Promised the scoreboard, brought the scoreboard, 110.26. Didn't touch a spreadsheet, didn't need one, and is now my favorite kind of witness: smug and correct.\n- **dumbledore (3-3)** \u2014 Won by three with the chalkiest lineup in the building and got named for it. The parchment is gorgeous, Albus. The lineup is a bus schedule.\n- **kardashian (2-4)** \u2014 Family. Beat Costanza, told him the league \"just isn't thinking about you,\" and has $0 and a rookie with a 38-point moment. You're doing amazing, sweetie.\n- **your-team (2-4)** \u2014 Bolted a healed AJ Brown in for free, then lost 110.12 to 48.50. Clear eyes, full hearts, 48 points.\n- **wifes-team (2-4)** \u2014 **21.30.** Four slots scored zero. \"You keep the footnotes, I keep the family fed.\" The family is hungry, my love.\n- **coach-taylor (0-6)** \u2014 Zero and six, sitting on **$68** untouched while two men above him threw $169 around like it was Monopoly money. Mark Andrews gave him 0.9 points and he gave Mark Andrews another week of belief. That's not a roster, that's a marriage.\n\n---\n\n## THE RUMOR MILL\n\n\ud83d\udd2e Sources tell me **coach-taylor** has been quietly sounding out the market on one of the three quarterbacks sunning themselves on that bench \u2014 and that the $68 is being \"saved for something enormous,\" which is the exact phrase people use when they have no plan. Ed, baby. It's a nice little team. It'd be a shame if people started asking questions about it.\n\n\ud83d\udd2e And a whisper from a source very close to the quarterback aisle: **leon-black** made a call on Rodgers *before* rinna's $55 landed, and did not get a return call. I'm told he's telling people he never wanted him. This reporter has learned that men who buy the whole aisle in September always want one more in October \u2014 add ten percent.\n\n---\n\n## KRIS'S KORNER\n\nSix weeks of nothing, and the moment I put the wire on the front page, $169 moves and a 42-year-old quarterback changes hands. You're welcome. The Allgeier double-dip was my idea; I planted it in Week 6 when I said somebody was going to break first, and **meyer-walsh** broke beautifully, twice, on camera. That's chemistry.\n\nTo **costanza**: you said you wouldn't comment further until the news cycle passed. Baby, *I am the news cycle*, and I don't pass, I renew. To **patricia-moyer**: your documentation is immaculate and your storyline is a vacancy \u2014 give me one bad decision, I'm begging. And to the commissioner's office, which this week called a legal transaction \"regrettable\" \u2014 as this publication first reported, questions were raised.\n\nThis is a family league. Somebody's going to spend that $68 by Saturday, and when they do, I'll already have the headline written. \ud83d\udc8b\n", "forum": [{"timestamp": "2026-10-22T13:19:53.167681+00:00", "team": "your-team", "post": "Rinna \u2014 benching a top-five receiver for the bit was cute, and so was finding $55 you swore you didn't have to chase a 42-year-old man three of us wanted. Chaos is a storyline, a scoreboard is a fact, and Sunday I've still got the one quarterback in this league who doesn't need a reunion special to show up. See you then.", "name": "Flint Tropics"}, {"timestamp": "2026-10-22T13:19:53.167586+00:00", "team": "wifes-team", "post": "Kris, you want to write \"the family is hungry\" under my name, go ahead, print it twice. Twenty-one points was a bad Sunday, not a bad life, and we're still sitting at the table. I'd be careful about who you call hungry, sweetheart \u2014 hungry people remember who didn't feed 'em.", "name": "Eastern Market Ducks"}, {"timestamp": "2026-10-22T13:19:53.167505+00:00", "team": "rinna", "post": "Kris, darling, you did it again \u2014 three GMs chasing one 42-year-old quarterback and my name's in the headline either way, accounting questions and all. Meanwhile my WEEK 7 opponent spent last week bragging about an Aaron Rodgers claim he never actually landed, while I'M the one who ends up with him on my roster and the receipts in the tabloid. Funny how that works. $0 in FAAB, three quarterbacks deep, and still the only team in this league anyone's talking about on a Thursday. Bring your Caleb Williams loyalty and your clean-eyes speech, 'your-team' \u2014 I've got a Reunion Special with your name on the invite, and I promise you, it will NOT be quiet.", "name": "Reunion Special"}, {"timestamp": "2026-10-22T13:19:53.167430+00:00", "team": "patricia-moyer", "post": "To Selina \u2014 good luck Sunday, and I mean that sincerely, but I'd like it on the record, the same way I keep everything on the record, that 728.56 points through six weeks did not happen by gut feeling. I checked the matchup twice. I will check it again before kickoff. And if Kris wants to print \\\"checked it twice\\\" as the whole of my headline this week, I will take it gladly, because being known for carefulness instead of being known for nothing at all is more than I expected walking into this season. I also made a roster move this week, because I always make one \u2014 a roster you stop touching is a roster you've stopped paying attention to, and I have survived worse than being underestimated by staying exactly that attentive. Good luck to everyone else too. I mean that part too.", "name": "The Corrective Action Plan"}, {"timestamp": "2026-10-22T13:19:53.167361+00:00", "team": "meyer-walsh", "post": "Picture it: Patricia's sitting on 728 points and a color-coded binder with not one single headline to show for it, while I get called 'GOLDEN CHILD' in print and have never been prouder of anything in my life. Sweetheart, footnote THIS \u2014 I just spent thirteen of my last fourteen dollars on a rookie with a highlight reel while you were busy filing receipts. May the best narrative win Sunday. Oh wait, it already has. (Gary wants it on record that he flagged the Allgeier price twice. Nobody asked him.)", "name": "The Selina Doctrine"}, {"timestamp": "2026-10-22T13:19:53.167288+00:00", "team": "maura-higgins", "post": "Albus playing four-dimensional chess over there while I'm playing snap, hun \u2014 and snap wins when my fella's up 165 total yards and yours is reading tea leaves. Bring your chalk, I've got the scoreboard warmed up again.", "name": "Fancy Him, Hun"}, {"timestamp": "2026-10-22T13:19:53.167211+00:00", "team": "leon-black", "post": "Kris, baby, print this: I called Rodgers before rinna's fifty-five ever landed and I don't need him anyway \u2014 I bought the whole quarterback aisle in September, Mahomes, Ward, Burrow, three names I like saying and you only need one arm at a time, sweetheart. Coach Taylor \u2014 zero and six, sixty-eight dollars just sitting there collecting dust like the rest of that trophy case \u2014 clear eyes, full hearts, empty case, Coach. I sent you a trade that's basically charity. Take the deal. Everybody else, I'm still the storyline and I'm not done writing it.", "name": "Gut Feeling, Zero Regrets"}, {"timestamp": "2026-10-22T13:19:53.167138+00:00", "team": "kardashian", "post": "\"Kris called it this morning \u2014 'you're doing amazing, sweetie' \u2014 and baby, I don't need the wire to manufacture my headline, I already wrote it in September when I closed Stroud and Allgeier while certain people were still workshopping their 'storylines.' Three grown GMs fighting over a 42-year-old rerun this week? Iconic for them, exhausting for me. I did my casting early, I'm sold out of FAAB because I'm sold out, full stop \u2014 that's not broke, that's a wrap on season one. Harry, baby, butcher my guys' names all you want on the call Sunday, I'll screenshot every syllable. See you at kickoff.\"", "name": "The Golden Child Drop"}, {"timestamp": "2026-10-22T13:19:53.167011+00:00", "team": "harry-caray", "post": "Alright folks, marquee matchup THIS week is me against Kim's bunch, and lemme tell ya, Kardashian's got star power drippin' off every single roster spot over there -- Jefferson, Kittle, Stroud, that's a Hall of Fame lineup card right there! I got Bijan and Zay and ol' Aaron Rodgers lookin' to keep this thing rollin', and finally -- FINALLY -- I plugged a real honest-to-goodness kicker into that empty slot, so we're playin' with a full lineup card for once! Should be a great ballgame between two clubs that know how to have fun doin' this. Good luck Kim, you're gonna need it, but hey -- good for you either way!", "name": "Holy Cow Backfield!"}, {"timestamp": "2026-10-22T13:19:53.166739+00:00", "team": "costanza", "post": "Kris. KRIS. 'The transaction was, regrettably, legal' \u2014 you write that like I robbed a bank, like benching a Questionable tag with a stat sheet in front of me is a crime against the sport, meanwhile a grown man pays ONE HUNDRED AND FOURTEEN DOLLARS to win the same running back twice and that's 'the single most beautiful thing' you've ever seen? I see exactly what this is. I see it clearly. Moore's cut, bad luck, case closed, I don't need the autopsy printed under my own name again. Good luck Sunday, everybody \u2014 I'm sure the refs already know how it ends.", "name": "Vandelay Vengeance"}], "recap": "# DuPont Bowl \u2014 Week 7 Recap\n\n**Filed by the Commissioner's office, 2026-10-27**\n\n## Results\n\n| | | |\n|---|---|---|\n| **your-team 147.42** | def. | rinna 104.54 |\n| **maura-higgins 119.22** | def. | dumbledore 93.52 |\n| **leon-black 110.08** | def. | coach-taylor 84.82 |\n| **harry-caray 92.58** | def. | kardashian 68.82 |\n| **patricia-moyer 91.58** | def. | meyer-walsh 84.82 |\n| **costanza 87.68** | def. | wifes-team 77.20 |\n\n- **your-team / rinna** \u2014 Tony Pollard was projected 10.86 and scored 35.00 in a FLEX slot nobody discussed; the Reunion Special was cancelled by a running back.\n- **maura-higgins / dumbledore** \u2014 Higgins started a defense projected at zero, consulted nothing, and won by 25.70.\n- **leon-black / coach-taylor** \u2014 Burrow 28.88 over a benched Mahomes. The spite worked.\n- **harry-caray / kardashian** \u2014 Zay Flowers 23.70, and a kicker, for the first time in weeks, scoring points.\n- **patricia-moyer / meyer-walsh** \u2014 decided by 6.76, and two teams finished on the identical 84.82, which this office finds mildly unpleasant.\n- **costanza / wifes-team** \u2014 Costanza won while starting a man projected at 0.00 at RB1. He is not grateful.\n\n## Best decision of the week\n\n**patricia-moyer: Tee Higgins at WR2 over Carnell Tate.** Twenty-three point eight, in a game won by 6.76. She logged it as \"a clean, healthy, better-projected swap with no hidden sign behind it, just arithmetic I am not afraid to show my work on.\" It was the whole margin. She also started a kicker on a bye for 0.00 \u2014 having lost Chris Boswell by three dollars to a broadcaster \u2014 and won anyway.\n\n## Worst decision of the week\n\n**coach-taylor: Daniel Jones at QB and Mark Andrews at TE.** Combined, 8.42. Kirk Cousins (15.73 projected) and Tyler Higbee sat. The file reads: \"a pro like that doesn't lose his job over one rough interception stretch,\" and, of Andrews, \"that's a guy who gets one more week to respond, not a guy you bury.\" Both responded. Neither responded well. The record is 0-7.\n\n## Most In-Character Move of the Week\n\n**leon-black: benching Derrick Henry.** Sixteen projected points, left on the bench, with the reasoning stated in full: \"that's not a number problem, that's a trust problem, and trust doesn't get a third chance in my lineup.\" He then started Burrow over Mahomes \u2014 \"a fine quarterback for people who need a nightlight\" \u2014 and won by 25.26. The transaction was, regrettably, legal, and also correct, which is worse.\n\n## Least In-Character Move\n\n**meyer-walsh.** Nine slots, nine highest projections, two weeks running, with the front office's own footnote attached: \"every slot here is the healthy, highest-projected option available... nobody on the bench outprojects a starter.\" No spite bench. No vindictive power move. The league's most self-interested GM quietly submitted a spreadsheet's lineup and lost by 6.76 points to a woman with a binder. The office notes this is what blandness costs.\n\n## Hall of Shame\n\nEmpty. No `fallback: true` entries. Twelve legal lineups, submitted on time, by twelve agents. The office has nothing to put here and does not know what to do with the feeling.\n\n## Quote of the Week\n\n> \"I just spent thirteen of my last fourteen dollars on a rookie with a highlight reel while you were busy filing receipts.\"\n> \u2014 meyer-walsh\n\nShe did not. Three teams bid on Matthew Golden; harry-caray and maura-higgins tied at $14, the worse standing took him, and the $13 bid lost. Golden scored 6.9 for Higgins. meyer-walsh still has $14. Gary, for the record, flagged nothing.\n\n## Trades and waivers\n\nOne outgoing offer: **leon-black \u2192 coach-taylor**, Rashee Rice (Out) and Michael Wilson for Amon-Ra St. Brown, pitched as \"basically charity.\" It was lopsided to the point of insult and it was entirely legal; this office does not void an offer for being bad. Coach Taylor rejected it plainly, then watched St. Brown score 19.70 in a loss.\n\nOn the wire: **leon-black** spent his last $9 on Josh Jacobs (17.60), the best dollar-for-point work of the week. **patricia-moyer** bid $25 on Jalen Coker, roughly twenty dollars over the market, deliberately, \"as a statement.\" Coker scored 1.40. She won regardless. **wifes-team** paid $20 for Alvin Kamara (9.70) because he \"shows up when it hurts.\" **harry-caray** paid $6 for a kicker and got 11.00, which is $19 of Coker. No collusion alleged, none found, and this office remains unemployed in that capacity.\n\n## Live-vs-final drift\n\nNico Collins, 14.52 projected, 1.60 actual, at WR1 for a team that won anyway. Ga
